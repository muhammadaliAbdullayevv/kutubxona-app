<style>
  /* Night (default) — ink & brass, a library after closing time */
  :root{
    --bg:#14100b; --card:#1f1710; --card2:#291f14; --text:#f4ecdc; --muted:#a89172;
    --accent:#d9a441; --accent2:#b5672e; --line:#34281a; --chip:#241b12; --danger:#e2685a;
    --radius:16px; --shadow:0 6px 24px rgba(0,0,0,.5);
  }
  /* Day — parchment & ink */
  :root[data-theme="day"]{
    --bg:#f7f5f0; --card:#ffffff; --card2:#eeebe2; --text:#1e1b16; --muted:#726c5f;
    --accent:#2f6b4f; --accent2:#1f4d38; --line:#e3ded1; --chip:#eeebe2; --danger:#c0392b;
    --shadow:0 6px 20px rgba(30,25,15,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overscroll-behavior-y:none;
    transition:background-color .25s, color .25s}
  body,.book,.si,.card,header,.sheetc,.chip,.tab,.btn,.pill,.authchip{transition:background-color .25s, border-color .25s, color .25s}
  .wrap{max-width:760px; margin:0 auto; padding:12px 14px 90px}
  header{position:sticky; top:0; z-index:20; background:linear-gradient(180deg,var(--bg) 72%,transparent); padding:8px 14px 10px; margin:0 -14px 4px}
  h1{font-size:20px; font-weight:700; margin:2px 0 10px; letter-spacing:.2px}
  .searchbar{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px}
  .searchbar svg{flex:0 0 auto; opacity:.7}
  .searchbar input{flex:1; background:none; border:0; outline:none; color:var(--text); font-size:15px}
  .searchbar .clr{opacity:.5; padding:2px 4px; display:none; cursor:pointer}
  .row{display:flex; gap:8px; align-items:center; overflow-x:auto; scrollbar-width:none; padding:10px 14px 2px; margin:0 -14px}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; background:var(--chip); border:1px solid var(--line); color:var(--muted); padding:7px 13px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; transition:.15s}
  .chip .n{opacity:.55; margin-left:4px}
  .chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent}
  .chip.on .n{opacity:.85}
  .tabs{display:flex; gap:6px; margin-top:2px}
  .tab{flex:1; text-align:center; padding:9px; border-radius:12px; font-weight:700; font-size:14px; color:var(--muted); background:var(--card); border:1px solid var(--line); cursor:pointer}
  .tab.on{color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent}
  .bar{display:flex; justify-content:space-between; align-items:center; margin:14px 2px 8px}
  .bar .lbl{font-size:13px; color:var(--muted); font-weight:600}
  .sort{background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:6px 8px; font-size:13px}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
  @keyframes cardIn{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
  .book,.si{animation:cardIn .4s cubic-bezier(.2,.8,.2,1) backwards; animation-delay:var(--d,0ms)}
  .book,.si,.chip,.tab,.btn,.authchip,.gtile{transition:transform .15s}
  .book:active,.si:active,.chip:active,.tab:active,.btn:active,.authchip:active,.gtile:active{transform:scale(.96)}
  @media (prefers-reduced-motion: reduce){.book,.si{animation:none!important}}
  .book{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; position:relative; display:flex; flex-direction:column}
  .cover{height:118px; display:flex; align-items:flex-end; padding:10px; position:relative}
  .cover .ini{font-size:30px; font-weight:800; color:rgba(255,255,255,.92); line-height:1; text-shadow:0 2px 8px rgba(0,0,0,.3)}
  .cover .aud{position:absolute; top:8px; right:8px; background:rgba(0,0,0,.35); border-radius:8px; padding:3px 7px; font-size:11px; font-weight:700; color:#fff}
  .ci{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .fav{position:absolute; top:8px; left:8px; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,.32); display:flex; align-items:center; justify-content:center; font-size:15px; z-index:2}
  .meta{padding:9px 10px 11px; display:flex; flex-direction:column; gap:4px; flex:1}
  .meta .t{font-weight:700; font-size:13.5px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .meta .a{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .meta .g{margin-top:auto; font-size:11px; color:var(--accent); font-weight:700}
  .meta .stats{display:flex; gap:8px; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
  .meta .stats b{color:var(--text)}
  .more{margin:18px auto 0; display:block; background:var(--card); border:1px solid var(--line); color:var(--text); padding:11px 22px; border-radius:12px; font-weight:700; font-size:14px}
  .empty{text-align:center; color:var(--muted); padding:60px 20px}
  .empty .em{font-size:40px; display:block; margin-bottom:10px}
  .skel{height:210px; border-radius:var(--radius); background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%); background-size:200% 100%; animation:sh 1.2s infinite}

  /* Discovery homepage */
  .section{margin:18px 0 6px}
  .shead{display:flex; align-items:baseline; justify-content:space-between; margin:0 2px 10px}

  .authchip .ac{font-size:11px; color:var(--muted)}

  .gtile{border-radius:14px; padding:14px; cursor:pointer; color:#fff; font-weight:800; font-size:15px; min-height:66px; display:flex; flex-direction:column; justify-content:center; box-shadow:var(--shadow)}

  .sheet.open{display:flex}

  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff}
  .btn.ghost{flex:0 0 auto; width:52px; background:var(--card); border:1px solid var(--line); color:var(--text)}
  .btn.ghost.on{color:var(--danger)}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--card2); border:1px solid var(--line); color:var(--text); padding:11px 18px; border-radius:12px; font-weight:600; font-size:14px; opacity:0; transition:.25s; z-index:99; box-shadow:var(--shadow)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .hint{color:var(--muted); font-size:13px; margin:6px 0}
  .cmeta{font-size:12px; color:var(--muted); font-weight:700}
  /* Profile overlay (streaks/badges) */
  #sheet2{z-index:55}
  /* Book globe */
  #globe{align-items:stretch; background:var(--bg)}
  #globeCanvas{width:100%; height:100%; touch-action:none; display:block}
  .gclose{position:fixed; top:calc(env(safe-area-inset-top) + 14px); right:14px; width:36px; height:36px; border-radius:50%; background:var(--chip); border:1px solid var(--line); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; z-index:1}
  .streakbig{display:flex; align-items:baseline; gap:8px; margin:4px 0 2px}
  .streakbig .n{font-size:40px; font-weight:800; line-height:1}
  .streakbig .u{font-size:14px; color:var(--muted); font-weight:600}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0}
  .statgrid .st{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
  .statgrid .st .sv{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums}
  .statgrid .st .sl{font-size:11.5px; color:var(--muted); font-weight:600}
  .pill.locked{opacity:.35}
  /* Ratings (Play-Store-style 1-5 stars + review) */
  .ratehead{display:flex; align-items:center; gap:16px; margin-bottom:12px}
  .ratebig{font-size:36px; font-weight:800; line-height:1}
  .ratebig .of5{font-size:15px; color:var(--muted); font-weight:600}
  .ratestars{color:#ffb100; font-size:15px; letter-spacing:1px}
  .ratecount{font-size:12px; color:var(--muted)}
  .ratedist{flex:1; display:flex; flex-direction:column; gap:3px}
  .ratedist .drow{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted)}
  .ratedist .dbar{flex:1; height:6px; border-radius:3px; background:var(--chip); overflow:hidden}
  .ratedist .dbar i{display:block; height:100%; background:#ffb100; border-radius:3px}
  .starpick{font-size:26px; letter-spacing:4px; cursor:pointer; user-select:none}
  .starpick span{opacity:.3}
  .starpick span.on{opacity:1}
  #rForm{margin-top:10px}
  #rForm textarea{width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:9px; font:inherit; resize:vertical; min-height:50px; margin-top:8px; box-sizing:border-box}
  #rForm button{margin-top:6px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:0; border-radius:10px; padding:8px 14px; font-weight:700; cursor:pointer}
  #rForm .rdel{margin-left:10px; background:none; color:var(--danger); border:0; font-weight:700; cursor:pointer; padding:8px 4px}
  .rrow{padding:10px 0; border-top:1px solid var(--line)}
  .rrow:first-child{border-top:0}
  .rrow .rstars{color:#ffb100; font-size:13px}
  .rrow .rtext{font-size:14px; margin:4px 0 6px; white-space:pre-wrap}
  .rrow .rvote{display:flex; gap:14px; font-size:12.5px; color:var(--muted)}
  .rrow .rvote span{cursor:pointer}
  .rrow .rvote span.on{color:var(--accent)}
</style>

<script>
const tg = window.Telegram?.WebApp;
const $ = s => document.querySelector(s);
const COMMUNITY_API_BASE = "https://pdf-audio-kitoblar.site";
// Sends the book straight into the user's chat with the bot (no deep link, no closing the
// Mini App) via the community API's cached file_id delivery. Rejects if there's no initData
// (opened outside Telegram) or the API call itself fails, so the caller can fall back to the
// classic deep-link + close behavior.
function deliverBook(id){
  if(!tg?.initData) return Promise.reject(new Error('no initData'));
  return fetch(COMMUNITY_API_BASE+'/api/books/'+encodeURIComponent(id)+'/deliver',{
    method:'POST',
    headers:{'Authorization':'tma '+tg.initData}
  }).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}
// Generic authenticated call to the community API — same Authorization convention as
// deliverBook, reused by discussion/profile/lists features. Auth header is only attached when
// initData exists, so anonymous callers hit read-only endpoints without it.
function api(path,opts){
  opts=opts||{};opts.headers=opts.headers||{};
  if(tg?.initData)opts.headers['Authorization']='tma '+tg.initData;
  if(opts.body)opts.headers['Content-Type']='application/json';
  return fetch(COMMUNITY_API_BASE+path,opts).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}
const canAct=()=>!!tg?.initData;
const COVERS=[['#c17a3d','#8c4a24'],['#a8452f','#6b2418'],['#4a6b4a','#2d4530'],['#c99a2e','#8a5c16'],['#5a4a6b','#382d45'],['#8a3a4a','#5c2530'],['#3a6b6b','#254545'],['#b06a2a','#6b3816'],['#6b5a3a','#453825']];
function coverFor(id){let h=0;const s=String(id||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return COVERS[h%COVERS.length];}
function initials(t){return String(t||'?').replace(/[^\p{L}\p{N} ]/gu,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'📖';}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// Uzbek Cyrillic -> Latin, so a Latin query matches a Cyrillic title and vice-versa.
const CYR={'а':'a','б':'b','в':'v','г':'g','ғ':'g','д':'d','е':'e','ё':'yo','ж':'j','з':'z','и':'i','й':'y','к':'k','қ':'q','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ў':'o','ф':'f','х':'x','ҳ':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':'','ь':'','э':'e','ю':'yu','я':'ya'};
// Canonical search key: lowercase, transliterate Cyrillic, drop apostrophes (o' == oʻ == ў),
// then keep letters/digits only. Both the query and the book text pass through this.
function canon(s){s=String(s||'').toLowerCase();let o='';for(const ch of s)o+=(CYR[ch]!==undefined?CYR[ch]:ch);return o.replace(/[ʻʼ'`'‘’ʼ]/g,'').replace(/[^\p{L}\p{N} ]/gu,' ').replace(/\s+/g,' ').trim();}
const norm=canon;
// True when strings are within one edit (insert/delete/substitute) — cheap typo tolerance.
function within1(a,b){if(a===b)return true;const la=a.length,lb=b.length;if(la===lb){const d=[];for(let k=0;k<la;k++)if(a[k]!==b[k]){d.push(k);if(d.length>2)break;}if(d.length===2&&d[1]===d[0]+1&&a[d[0]]===b[d[1]]&&a[d[1]]===b[d[0]])return true;}if(Math.abs(la-lb)>1)return false;let i=0,j=0,e=0;while(i<la&&j<lb){if(a[i]===b[j]){i++;j++;continue;}if(++e>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++;}}if(i<la||j<lb)e++;return e<=1;}
function indexBook(b){b._t=canon(b.t);b._a=canon(b.a);b._g=canon(b.g);b._sm=canon(b.sm);b._subs=canon((b.s||[]).join(' '));b._w=(b._t+' '+b._a).split(' ').filter(w=>w.length>=3);}

let DB={books:[],genres:[],audiences:[],types:[],bot:''};
let byId={};
let state={q:'',genre:'',audience:'',type:'',sort:'relevance',view:'browse',shown:24,result:[],all:false};
let HOME={newest:[],audio:[],authors:[],genres:[]};
let favs=new Set();
const PAGE=24;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
function haptic(x='light'){try{tg?.HapticFeedback?.impactOccurred(x)}catch(e){}}

// ---- favourites via Telegram CloudStorage (fallback: localStorage) ----
function cloudGet(){return new Promise(res=>{
  if(tg?.CloudStorage?.getItem){tg.CloudStorage.getItem('favs',(e,v)=>res(e?null:v));}
  else res(localStorage.getItem('favs'));
});}
function cloudSet(v){if(tg?.CloudStorage?.setItem)tg.CloudStorage.setItem('favs',v,()=>{});else localStorage.setItem('favs',v);}
async function loadFavs(){try{const v=await cloudGet();favs=new Set(v?JSON.parse(v):[]);}catch(e){favs=new Set();}}
function saveFavs(){cloudSet(JSON.stringify([...favs].slice(0,500)));}

// ---- search / filter / sort (all client-side) ----
function score(b,terms){
  if(b._t===undefined)indexBook(b);
  let sc=0;
  for(const term of terms){
    if(!term)continue;
    let s=0;
    if(b._t.startsWith(term))s=120;else if(b._t.includes(term))s=60;
    if(b._a.includes(term))s=Math.max(s,35);
    if(b._g.includes(term))s=Math.max(s,25);
    if(b._subs.includes(term))s=Math.max(s,20);
    if(b._sm.includes(term))s=Math.max(s,10);
    if(s===0&&term.length>=4){    // typo fallback: edit-distance<=1 vs title/author words
      for(const w of b._w){if(within1(w,term)){s=40;break;}}
    }
    if(s===0)return 0;           // every term must match somewhere (AND)
    sc+=s;
  }
  return sc;
}
function compute(){
  const terms=norm(state.q).split(/\s+/).filter(Boolean);
  let list;
  if(state.view==='favorites'){list=[...favs].map(id=>byId[id]).filter(Boolean);}
  else{list=DB.books;}
  let arr=[];
  for(const b of list){
    if(state.genre&&b.g!==state.genre)continue;
    if(state.audience&&b.au!==state.audience)continue;
    if(state.type&&((state.type==='audio')!==!!b.ha))continue;
    if(terms.length){const sc=score(b,terms);if(sc<=0)continue;b._s=sc;}
    arr.push(b);
  }
  if(terms.length&&state.sort==='relevance')arr.sort((x,y)=>y._s-x._s);
  else if(state.sort==='title')arr.sort((x,y)=>(x.t||'').localeCompare(y.t||'','uz'));
  else if(state.sort==='popular')arr.sort((x,y)=>(y.dl||0)-(x.dl||0));
  // 'newest' & default keep DB order (already newest-first)
  state.result=arr;state.shown=PAGE;
}

function chipRow(el,items,cur,key,fmt){
  el.innerHTML=(key==='genre'?`<span class="chip ${!cur?'on':''}" data-v="">Barchasi</span>`:'')+
    items.map(x=>`<span class="chip ${cur===x.v?'on':''}" data-v="${esc(x.v)}">${fmt(x)}<span class="n">${x.c}</span></span>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const v=c.dataset.v; state[key]=(state[key]===v&&key!=='genre')?'':v; state.all=false; haptic(); renderChips(); run();
  });
}
function renderChips(){
  chipRow($('#genres'),DB.genres.map(x=>({v:x.v,l:x.v,c:x.c})),state.genre,'genre',x=>esc(x.l));
  const f=$('#filters');
  f.innerHTML=DB.types.map(x=>`<span class="chip ${state.type===x.v?'on':''}" data-k="type" data-v="${x.v}">${x.v==='audio'?'🎧':'📄'} ${esc(x.l)}<span class="n">${x.c}</span></span>`).join('')+
    DB.audiences.map(x=>`<span class="chip ${state.audience===x.v?'on':''}" data-k="audience" data-v="${esc(x.v)}">${esc(x.l)}<span class="n">${x.c}</span></span>`).join('');
  f.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const k=c.dataset.k;state[k]=state[k]===c.dataset.v?'':c.dataset.v;state.all=false;haptic();renderChips();run();});
}

function cardHtml(b,i){
  const[c1,c2]=coverFor(b.i);const fav=favs.has(b.i);
  return `<div class="book" data-id="${esc(b.i)}" style="--d:${Math.min(i||0,12)*30}ms">
    <div class="cover" style="background:linear-gradient(135deg,${c1},${c2})">
      ${b.hc?`<img class="ci" src="covers/${encodeURIComponent(b.i)}.jpg" loading="lazy" onerror="this.remove()">`:''}
      <span class="fav" data-fav="${esc(b.i)}">${fav?'❤️':'🤍'}</span>
      ${b.ha?'<span class="aud">🎧</span>':''}
      <span class="ini">${esc(initials(b.t))}</span>
    </div>
    <div class="meta"><div class="t">${esc(b.t)}</div>
      <div class="a">${esc(b.a||'Noma\'lum muallif')}</div>
      ${(b.dl||b.rc)?`<div class="stats">${b.rc?`⭐ <b>${b.rt}</b> (${b.rc})`:''}${b.dl?`${b.rc?' · ':''}⬇️ <b>${fmtNum(b.dl)}</b>`:''}</div>`:''}
      <div class="g">${esc(b.g||'')}</div></div></div>`;
}
function fmtNum(n){n=n||0;return n>=1000?(n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'k':String(n);}
function render(){
  const grid=$('#grid');
  const slice=state.result.slice(0,state.shown);
  grid.innerHTML=slice.map((b,i)=>cardHtml(b,i)).join('');
  grid.querySelectorAll('.book').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-fav]'))return;openDetail(el.dataset.id);});
  grid.querySelectorAll('[data-fav]').forEach(el=>el.onclick=e=>{e.stopPropagation();toggleFav(el.dataset.fav);});
  $('#empty').style.display=state.result.length?'none':'block';
  $('#more').style.display=state.result.length>state.shown?'block':'none';
  const noun=state.view==='favorites'?'saqlangan':'kitob';
  $('#count').textContent=state.result.length?`${state.result.length} ta ${noun}`:'';
}
// ---- discovery homepage (shown when browsing with no query/filter) ----
function buildHome(){
  HOME.newest=DB.books.slice(0,18);
  HOME.audio=DB.books.filter(b=>b.ha).slice(0,18);
  const ac={};
  for(const b of DB.books){const a=(b.a||'').trim();if(a&&a.length>1&&!/noma'?lum/i.test(a))ac[a]=(ac[a]||0)+1;}
  HOME.authors=Object.entries(ac).filter(([a,c])=>c>=2).sort((x,y)=>y[1]-x[1]).slice(0,16).map(([a,c])=>({a,c}));
  HOME.genres=DB.genres.slice(0,5).map(g=>({v:g.v,c:g.c,books:DB.books.filter(b=>b.g===g.v).slice(0,18)}));
}
function siHtml(b,i){const[c1,c2]=coverFor(b.i);return `<div class="si" data-id="${esc(b.i)}" style="--d:${Math.min(i||0,12)*30}ms"><div class="sc" style="background:linear-gradient(135deg,${c1},${c2})">${b.hc?`<img class="ci" src="covers/${encodeURIComponent(b.i)}.jpg" loading="lazy" onerror="this.remove()">`:''}${b.ha?'<span class="aud">🎧</span>':''}<span class="ini">${esc(initials(b.t))}</span></div><div class="st">${esc(b.t)}</div><div class="sa">${esc(b.a||'')}</div>${b.rc?`<div class="sr">⭐ <b>${b.rt}</b> (${b.rc})</div>`:''}</div>`;}
function shelf(title,books,see){return `<div class="section"><div class="shead"><h2>${esc(title)}</h2>${see?`<span class="see" ${see}>Barchasi →</span>`:''}</div><div class="shelf">${books.map((b,i)=>siHtml(b,i)).join('')}</div></div>`;}
function marqueeShelf(title,books,see){
  if(!books.length)return '';
  const cards=books.map((b,i)=>siHtml(b,i)).join('');
  return `<div class="section"><div class="shead"><h2>${esc(title)}</h2>${see?`<span class="see" ${see}>Barchasi →</span>`:''}</div>
    <div class="mqwrap"><div class="mqtrack">${cards}${cards}</div></div>
  </div>`;
}
function renderHome(){
  const h=$('#home');let html='';
  if(HOME.newest.length)html+=marqueeShelf("🆕 Yangi qo'shilgan",HOME.newest,'data-see="newest"');
  if(HOME.authors.length)html+=`<div class="section"><div class="shead"><h2>✍️ Mashhur mualliflar</h2></div><div class="authchips">${HOME.authors.map(a=>`<div class="authchip" data-auth="${esc(a.a)}"><span class="an">${esc(a.a)}</span><span class="ac">${a.c} ta kitob</span></div>`).join('')}</div></div>`;
  if(HOME.audio.length)html+=shelf("🎧 Audiokitoblar",HOME.audio,'data-see="audio"');
  for(const g of HOME.genres)html+=shelf(g.v,g.books,`data-see="genre" data-v="${esc(g.v)}"`);
  h.innerHTML=html;
  h.querySelectorAll('.si').forEach(el=>el.onclick=()=>openDetail(el.dataset.id));
  h.querySelectorAll('[data-auth]').forEach(el=>el.onclick=()=>{state.all=false;$('#q').value=el.dataset.auth;state.q=el.dataset.auth;$('#clr').style.display='block';haptic();run();window.scrollTo(0,0);});
  h.querySelectorAll('[data-see]').forEach(el=>el.onclick=()=>{const s=el.dataset.see;if(s==='newest'){state.all=true;state.sort='newest';$('#sort').value='newest';}else if(s==='audio'){state.type='audio';renderChips();}else if(s==='genre'){state.genre=el.dataset.v;renderChips();}haptic();run();window.scrollTo(0,0);});
}
// ---- gentle auto-scroll for the "recently added" ticker, native scroll underneath so a
// touch/swipe always fully overrides it (pauses the moment a finger touches it, resumes a
// couple seconds after release) ----
let mqPaused=false,mqResumeTimer=null;
const mqReduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
if(!mqReduced){
  (function mqTick(){
    const el=$('.mqwrap');
    if(el&&!mqPaused){
      el.scrollLeft+=1.6;
      const half=el.scrollWidth/2;
      if(half>0&&el.scrollLeft>=half)el.scrollLeft-=half;
    }
    requestAnimationFrame(mqTick);
  })();
  $('#home').addEventListener('pointerdown',e=>{if(e.target.closest('.mqwrap'))mqPaused=true;});
  window.addEventListener('pointerup',()=>{if(!mqPaused)return;clearTimeout(mqResumeTimer);mqResumeTimer=setTimeout(()=>{mqPaused=false;},2500);});
  window.addEventListener('pointercancel',()=>{if(!mqPaused)return;clearTimeout(mqResumeTimer);mqResumeTimer=setTimeout(()=>{mqPaused=false;},2500);});
}

// ---- book globe: rotatable 3D sphere of book nodes (Canvas2D, hand-rolled projection) ----
// STAGE 2: real anchor books (popularity+genre-diversity picked), tap-to-open wired to the
// real openDetail(), "back to map" round-trip. Still no zoom/LOD/lines/labels — those are
// later stages, once this integration seam is proven solid.
const GOLDEN_ANGLE=Math.PI*(3-Math.sqrt(5));
function fibSpherePoint(i,N){
  const y=1-(i/(N-1))*2, rY=Math.sqrt(Math.max(0,1-y*y)), theta=GOLDEN_ANGLE*i;
  return {x:Math.cos(theta)*rY, y:y, z:Math.sin(theta)*rY};
}
// Popularity is extremely sparse in this catalog (most books have 0 downloads, almost none
// have ratings yet), so raw popularity alone would collapse into one giant tie-block and
// silently exclude sparse genres. hash31 (duplicated from coverFor()'s own formula, not
// refactored — keeps this feature's diff isolated from that working code) gives a stable
// tiebreak so "popular" is at least deterministic and genre-diverse rather than arbitrary
// array order.
function popScore(b){return (b.dl||0)*3 + (b.rc?b.rt*b.rc:0) + (b.hc?2:0);}
function hash31(s){let h=0;s=String(s||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
const GLOBE={built:false,points:[],projected:[],yaw:0,pitch:0.3,zoom:1,raf:null};
function buildGlobe(){
  const byGenre={};
  for(const b of DB.books){(byGenre[b.g||'?']=byGenre[b.g||'?']||[]).push(b);}
  const total=DB.books.length||1;
  let anchors=[];
  for(const g in byGenre){
    const bucket=byGenre[g];
    const k=Math.max(6,Math.round(200*bucket.length/total));
    const sorted=bucket.slice().sort((x,y)=>{
      const d=popScore(y)-popScore(x);
      return d!==0?d:hash31(x.i)-hash31(y.i);
    });
    anchors=anchors.concat(sorted.slice(0,k));
  }
  const N=anchors.length;
  GLOBE.points=anchors.map((b,i)=>{
    const p=fibSpherePoint(i,N);
    return {id:b.i, t:b.t, x:p.x, y:p.y, z:p.z};
  });
  GLOBE.built=true;
}
function globeDraw(){
  const canvas=$('#globeCanvas');
  if(!canvas)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  }
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2, R=Math.min(w,h)*0.34*GLOBE.zoom;
  const cosY=Math.cos(GLOBE.yaw),sinY=Math.sin(GLOBE.yaw);
  const cosP=Math.cos(GLOBE.pitch),sinP=Math.sin(GLOBE.pitch);
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#d9a441';
  GLOBE.projected=[];
  for(const p of GLOBE.points){
    // rotate around Y (yaw) then X (pitch)
    let x=p.x*cosY - p.z*sinY;
    let z=p.x*sinY + p.z*cosY;
    let y=p.y*cosP - z*sinP;
    z=p.y*sinP + z*cosP;
    if(z<-0.05)continue; // cull back-facing (weak perspective, camera looking down -z)
    const scale=0.75+0.25*z; // nearer points render slightly larger
    const sx=cx+x*R, sy=cy-y*R;
    const r=3.6*scale;
    ctx.globalAlpha=0.35+0.65*Math.max(0,z);
    ctx.fillStyle=accent;
    ctx.beginPath();
    ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fill();
    GLOBE.projected.push({id:p.id,sx,sy,r});
  }
  ctx.globalAlpha=1;
}
function globeTick(){
  globeDraw();
  GLOBE.raf=requestAnimationFrame(globeTick);
}
function hitTestGlobe(clientX,clientY){
  const canvas=$('#globeCanvas');
  const rect=canvas.getBoundingClientRect();
  const x=clientX-rect.left, y=clientY-rect.top;
  let best=null,bestD=18*18; // 18px tap-target radius, squared (compared against squared dist)
  for(const p of GLOBE.projected){
    const dx=p.sx-x, dy=p.sy-y, d=dx*dx+dy*dy;
    if(d<bestD){bestD=d;best=p;}
  }
  return best;
}
let openedFromGlobe=false;
function onGlobeNodeTap(id){
  haptic();
  if(GLOBE.raf){cancelAnimationFrame(GLOBE.raf);GLOBE.raf=null;} // pause while the sheet covers it
  openedFromGlobe=true;
  openDetail(id);
}
let globeDrag=null;
function wireGlobeInteraction(){
  const canvas=$('#globeCanvas');
  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    globeDrag={x0:e.clientX,y0:e.clientY,yaw0:GLOBE.yaw,pitch0:GLOBE.pitch,moved:false};
  });
  canvas.addEventListener('pointermove',e=>{
    if(!globeDrag)return;
    const dx=e.clientX-globeDrag.x0, dy=e.clientY-globeDrag.y0;
    if(!globeDrag.moved && Math.hypot(dx,dy)>6)globeDrag.moved=true;
    GLOBE.yaw=globeDrag.yaw0 + dx*0.006;
    GLOBE.pitch=Math.max(-1.4,Math.min(1.4,globeDrag.pitch0 - dy*0.006));
  });
  canvas.addEventListener('pointerup',e=>{
    if(globeDrag && !globeDrag.moved){
      const hit=hitTestGlobe(e.clientX,e.clientY);
      if(hit)onGlobeNodeTap(hit.id);
    }
    globeDrag=null;
  });
  canvas.addEventListener('pointercancel',()=>{globeDrag=null;});
}
function openGlobe(){
  if(!DB.books.length){toast('Kutubxona hali yuklanmoqda...');return;}
  if(!GLOBE.built){buildGlobe();wireGlobeInteraction();}
  $('#globe').classList.add('open');
  tg?.BackButton?.show();
  if(!GLOBE.raf)GLOBE.raf=requestAnimationFrame(globeTick);
}
function closeGlobe(){
  $('#globe').classList.remove('open');
  tg?.BackButton?.hide();
  if(GLOBE.raf){cancelAnimationFrame(GLOBE.raf);GLOBE.raf=null;}
}
$('#btnGlobe').onclick=()=>{haptic();openGlobe();};
$('#globeClose').onclick=()=>closeGlobe();

function isHome(){return state.view==='browse'&&!state.q&&!state.genre&&!state.audience&&!state.type&&!state.all;}
function showHome(on){$('#home').style.display=on?'block':'none';$('#grid').style.display=on?'none':'grid';$('.bar').style.display=on?'none':'flex';if(on){$('#more').style.display='none';$('#empty').style.display='none';}}
function run(){if(isHome()){renderHome();showHome(true);}else{compute();render();showHome(false);}}

function toggleFav(id){
  haptic('medium');
  if(favs.has(id))favs.delete(id);else favs.add(id);
  saveFavs();
  if(state.view==='favorites')run();else render();
  if($('#sheet').classList.contains('open')){const el=$('#dFav');if(el){const on=favs.has(id);el.classList.toggle('on',on);el.textContent=on?'❤️':'🤍';}}
  toast(favs.has(id)?'❤️ Saqlandi':'Olib tashlandi');
}

function relatedShelf(b){
  const byAuthor=b.a?DB.books.filter(x=>x.i!==b.i&&x.a===b.a):[];
  const seen=new Set(byAuthor.map(x=>x.i));
  const byGenre=b.g?DB.books.filter(x=>x.i!==b.i&&x.g===b.g&&!seen.has(x.i)):[];
  const groups=[['Shu muallifdan',byAuthor.slice(0,12)],['Shunga o’xshash',byGenre.slice(0,12)]].filter(([,arr])=>arr.length);
  if(!groups.length)return '';
  return groups.map(([label,arr])=>`<div class="sec"><h3>${esc(label)}</h3><div class="shelf" style="margin:0 -18px; padding:2px 18px 4px">${arr.map((b,i)=>siHtml(b,i)).join('')}</div></div>`).join('');
}
function openDetail(id){
  const b=byId[id];if(!b)return;haptic();
  const sh=$('#sheet'),c=$('#sheetc');sh.classList.add('open');tg?.BackButton?.show();
  const[c1,c2]=coverFor(b.i);const fav=favs.has(b.i);
  const pill=(l,v)=>v?`<span class="pill">${l} <b>${esc(v)}</b></span>`:'';
  const audLabel=(DB.audiences.find(a=>a.v===b.au)||{}).l;
  const typeTxt=b.ha?(b.ap>1?`Audiokitob · ${b.ap} qism`:'Audiokitob'):'PDF / matn';
  c.innerHTML=`
    <div class="dhero" style="background:linear-gradient(135deg,${c1},${c2})">${b.hc?`<img class="ci" src="covers/${encodeURIComponent(b.i)}.jpg" onerror="this.remove()">`:''}<div class="dgrip"></div><span class="ini">${esc(initials(b.t))}</span></div>
    <div class="dbody">
      <h2 class="dtitle">${esc(b.t)}</h2>
      <div class="dauthor">${esc(b.a||'Noma\'lum muallif')}</div>
      <div class="pills">${pill('📂',b.g)}${pill('🎯',audLabel)}${pill('🗓',b.y)}${pill('🌐',b.l)}<span class="pill">${b.ha?'🎧':'📄'} <b>${esc(typeTxt)}</b></span>${b.mb?`<span class="pill">💾 <b>${b.mb} MB</b></span>`:''}${b.dl?`<span class="pill">⬇️ <b>${fmtNum(b.dl)}</b></span>`:''}</div>
      ${b.sm?`<div class="sec"><h3>Qisqacha</h3><p>${esc(b.sm)}</p></div>`:''}
      ${b.d?`<div class="sec"><h3>Tavsif</h3><p>${esc(b.d)}</p></div>`:''}
      ${(b.s&&b.s.length)?`<div class="sec"><h3>Mavzular</h3><div class="subs">${b.s.map(s=>`<span class="sub" data-sub="${esc(s)}">${esc(s)}</span>`).join('')}</div></div>`:''}
      <div class="sec" id="rSec"><h3>⭐ Reyting</h3><div id="rBody">Yuklanmoqda...</div></div>
      ${relatedShelf(b)}
    </div>
    <div class="actions">
      <button class="btn primary" id="openBot">📖 Botda o'qish</button>
      <button class="btn ghost ${fav?'on':''}" id="dFav">${fav?'❤️':'🤍'}</button>
      <button class="btn ghost" id="dShare">↗️</button>
      ${openedFromGlobe?'<button class="btn ghost" id="dBackGlobe">🌐</button>':''}
    </div>`;
  const url=`https://t.me/${DB.bot}?start=b_${encodeURIComponent(b.i)}`;
  const openBotFallback=()=>{tg?.openTelegramLink?tg.openTelegramLink(url):window.open(url);setTimeout(()=>tg?.close?.(),150);};
  $('#openBot').onclick=()=>{
    haptic('medium');
    const btn=$('#openBot');const label=btn.textContent;
    btn.textContent='Yuborilmoqda...';btn.disabled=true;
    deliverBook(b.i).then(()=>{
      btn.textContent='✅ Yuborildi — botni tekshiring';
      setTimeout(()=>{btn.textContent=label;btn.disabled=false;},2500);
    }).catch(()=>{
      // Couldn't deliver in-app (not cached, bot not started yet, etc.) — only now does the
      // classic deep-link + close-the-Mini-App path run, so a genuine failure is what leaves.
      btn.textContent=label;btn.disabled=false;
      openBotFallback();
    });
  };
  $('#dFav').onclick=()=>toggleFav(b.i);
  $('#dShare').onclick=()=>{const txt=`📚 ${b.t}${b.a?' — '+b.a:''}`;const s=`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(txt)}`;tg?.openTelegramLink?tg.openTelegramLink(s):navigator.share?.({title:b.t,url});};
  const dBackGlobe=$('#dBackGlobe');
  if(dBackGlobe)dBackGlobe.onclick=()=>{closeSheet();if(!GLOBE.raf)GLOBE.raf=requestAnimationFrame(globeTick);};
  c.querySelectorAll('[data-sub]').forEach(el=>el.onclick=()=>{closeSheet();$('#q').value=el.dataset.sub;state.q=el.dataset.sub;$('#clr').style.display='block';if(state.view!=='browse'){state.view='browse';setTabs();}run();window.scrollTo(0,0);});
  c.querySelectorAll('.si').forEach(el=>el.onclick=()=>openDetail(el.dataset.id));
  loadRating(b.i);
  c.scrollTop=0;
}
function closeSheet(){$('#sheet').classList.remove('open');tg?.BackButton?.hide();openedFromGlobe=false;}

// ---- profile overlay (reading streak/badges) ----
function openSheet2(html){$('#sheet2c').innerHTML=html;$('#sheet2').classList.add('open');tg?.BackButton?.show();}
function closeSheet2(){$('#sheet2').classList.remove('open');tg?.BackButton?.hide();}
const _BADGE_META={
  streak_3:{emoji:'🔥',label:"Streak boshlandi"},
  streak_7:{emoji:'🔥',label:"Haftalik o'quvchi"},
  bookworm:{emoji:'📚',label:'Kitobxon'},
  collector:{emoji:'⭐',label:"To'plovchi"},
  voice:{emoji:'💬',label:"Faol a'zo"},
};
function themeChipsHtml(){
  const opt=(m,l)=>`<span class="chip ${themeMode===m?'on':''}" data-m="${m}">${l}</span>`;
  return `<div class="sec"><h3>Mavzu</h3><div class="row" id="themeChips" style="padding:2px 0; margin:0">${opt('day',"☀️ Kunduzgi")}${opt('night',"🌙 Tungi")}${opt('system',"⚙️ Tizim")}</div></div>`;
}
function wireThemeChips(){
  $('#themeChips').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
    haptic();setThemeMode(el.dataset.m);
    $('#themeChips').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.m===themeMode));
  });
}
function profileShellHtml(){
  return `<div class="dbody" style="padding-top:20px">
    <h2 class="dtitle">👤 Profil</h2>
    ${themeChipsHtml()}
    <div id="pBody">Yuklanmoqda...</div>
  </div>`;
}
function loadProfile(){
  const body=$('#pBody');if(!body)return;
  if(!canAct()){body.innerHTML='<p class="hint">Profilingizni ko\'rish uchun botda oching.</p>';return;}
  api('/api/profile/me').then(r=>{
    const s=r.streak,st=r.stats;
    const badges=r.badges.map(b=>{const m=_BADGE_META[b.code]||{emoji:'🏅',label:b.code};return `<span class="pill${b.achieved?'':' locked'}">${m.emoji} <b>${esc(m.label)}</b></span>`;}).join('');
    body.innerHTML=`
      <div class="streakbig"><span class="n">${s.current_streak}</span><span class="u">kunlik seriya${s.active_today?' · bugun faol 🔥':''}</span></div>
      <div class="statgrid">
        <div class="st"><div class="sv">${st.total_opens}</div><div class="sl">ochilgan kitoblar</div></div>
        <div class="st"><div class="sv">${st.favorites}</div><div class="sl">sevimlilar</div></div>
        <div class="st"><div class="sv">${st.comments}</div><div class="sl">izohlar</div></div>
        <div class="st"><div class="sv">${s.best_streak}</div><div class="sl">eng uzun seriya</div></div>
      </div>
      <div class="sec"><h3>Nishonlar</h3><div class="pills">${badges}</div></div>`;
  }).catch(()=>{body.innerHTML='<p class="hint">Ma\'lumot yuklanmadi.</p>';});
}
$('#btnProfile').onclick=()=>{haptic();openSheet2(profileShellHtml());wireThemeChips();loadProfile();};
$('#sheet2').onclick=e=>{if(e.target.id==='sheet2')closeSheet2();};

// ---- ratings (Play-Store-style 1-5 stars + optional review; flat, not repliable; other
// readers vote a review "helpful" yes/no) ----
let myRatingStars=0;
function starsHtml(n,cls){cls=cls||'ratestars';let s='';for(let i=1;i<=5;i++)s+=i<=Math.round(n)?'★':'☆';return `<span class="${cls}">${s}</span>`;}
function ratingRowHtml(r){
  const voted=r.my_vote;
  return `<div class="rrow" data-id="${esc(r.id)}">
    <div class="rstars">${starsHtml(r.stars)}</div>
    ${r.review_text?`<div class="rtext">${esc(r.review_text)}</div>`:''}
    <div class="cmeta">${esc(r.alias)}</div>
    <div class="rvote">
      <span class="rhelp${voted===true?' on':''}" data-id="${esc(r.id)}" data-v="1"${canAct()?'':' data-off="1"'}>👍 Foydali (${r.helpful_yes})</span>
      <span class="rhelp${voted===false?' on':''}" data-id="${esc(r.id)}" data-v="0"${canAct()?'':' data-off="1"'}>👎 Foydali emas (${r.helpful_no})</span>
    </div>
  </div>`;
}
function wireRatingVotes(scope,bookId){
  scope.querySelectorAll('.rhelp').forEach(el=>{
    if(el.dataset.off)return;
    el.onclick=()=>{
      api('/api/ratings/'+encodeURIComponent(el.dataset.id)+'/vote',{method:'POST',body:JSON.stringify({helpful:el.dataset.v==='1'})})
        .then(()=>loadRatingList(bookId)).catch(()=>{});
    };
  });
}
function loadRatingList(bookId){
  const list=$('#rList');if(!list)return;
  api('/api/books/'+encodeURIComponent(bookId)+'/ratings?limit=20').then(r=>{
    list.innerHTML=r.ratings.length?r.ratings.map(ratingRowHtml).join(''):'<p class="hint">Hali baholar yo\'q. Birinchi bo\'ling!</p>';
    wireRatingVotes(list,bookId);
  }).catch(()=>{list.innerHTML='<p class="hint">Yuklanmadi.</p>';});
}
function loadRating(bookId){
  const body=$('#rBody');if(!body)return;
  api('/api/books/'+encodeURIComponent(bookId)+'/rating').then(r=>{
    const pct=n=>r.count?Math.round((r.distribution[n]||0)/r.count*100):0;
    const dist=[5,4,3,2,1].map(n=>`<div class="drow"><span>${n}</span><div class="dbar"><i style="width:${pct(n)}%"></i></div></div>`).join('');
    myRatingStars=r.my_rating?r.my_rating.stars:0;
    const myText=(r.my_rating&&r.my_rating.review_text)||'';
    const myPicker=`<div class="starpick" id="rPick">${[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${n<=myRatingStars?'on':''}">★</span>`).join('')}</div>`;
    body.innerHTML=`
      <div class="ratehead">
        <div><div class="ratebig">${r.count?r.average:'–'}<span class="of5">/5</span></div>${starsHtml(r.average)}<div class="ratecount">${r.count} ta baho</div></div>
        <div class="ratedist">${dist}</div>
      </div>
      ${canAct()?`<div class="sec"><h3>Sizning bahoyingiz</h3>${myPicker}
        <form id="rForm">
          <textarea id="rText" maxlength="2000" placeholder="Fikringiz (ixtiyoriy)...">${esc(myText)}</textarea>
          <button type="submit">${r.my_rating?'Yangilash':'Yuborish'}</button>
          ${r.my_rating?'<button type="button" class="rdel" id="rDel">O\'chirish</button>':''}
        </form>
      </div>`:'<p class="hint">Baho berish uchun botda oching.</p>'}
      <div id="rList">Yuklanmoqda...</div>`;
    if(canAct()){
      $('#rPick').querySelectorAll('span').forEach(el=>el.onclick=()=>{
        myRatingStars=parseInt(el.dataset.n,10);
        $('#rPick').querySelectorAll('span').forEach(s=>s.classList.toggle('on',parseInt(s.dataset.n,10)<=myRatingStars));
      });
      $('#rForm').addEventListener('submit',e=>{
        e.preventDefault();
        if(!myRatingStars){toast('Yulduz tanlang');return;}
        const text=$('#rText').value.trim();
        api('/api/books/'+encodeURIComponent(bookId)+'/rating',{method:'POST',body:JSON.stringify({stars:myRatingStars,review_text:text||null})}).then(()=>{
          toast('Baho saqlandi');loadRating(bookId);
        }).catch(()=>toast('Xatolik yuz berdi'));
      });
      const delBtn=$('#rDel');
      if(delBtn)delBtn.onclick=()=>{
        api('/api/books/'+encodeURIComponent(bookId)+'/rating/delete',{method:'POST'}).then(()=>{
          toast('Baho o\'chirildi');loadRating(bookId);
        }).catch(()=>{});
      };
    }
    loadRatingList(bookId);
  }).catch(()=>{body.innerHTML='<p class="hint">Yuklanmadi.</p>';});
}

// events
let deb;
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim();state.all=false;$('#clr').style.display=state.q?'block':'none';clearTimeout(deb);deb=setTimeout(()=>{if(state.view!=='browse'){state.view='browse';setTabs();}run();},200);});
$('#clr').onclick=()=>{$('#q').value='';state.q='';state.all=false;$('#clr').style.display='none';run();};
$('#sort').onchange=e=>{state.sort=e.target.value;run();};
$('#more').onclick=()=>{state.shown+=PAGE;render();};
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet();};
function setTabs(){$('#tabBrowse').classList.toggle('on',state.view==='browse');$('#tabFav').classList.toggle('on',state.view==='favorites');}
$('#tabBrowse').onclick=()=>{state.view='browse';state.q='';$('#q').value='';$('#clr').style.display='none';state.genre='';state.audience='';state.type='';state.all=false;renderChips();setTabs();run();window.scrollTo(0,0);};
$('#tabFav').onclick=()=>{state.view='favorites';state.all=false;setTabs();run();};
window.addEventListener('scroll',()=>{if(isHome())return;if(window.innerHeight+window.scrollY>=document.body.offsetHeight-500&&state.result.length>state.shown){state.shown+=PAGE;render();}});

// ---- theme: day / night / system (manual choice always wins; "system" follows Telegram's
// own light/dark setting, or the OS preference outside Telegram) ----
let themeMode='system';
try{themeMode=localStorage.getItem('themeMode')||'system';}catch(e){}
function resolveTheme(){
  if(themeMode==='day'||themeMode==='night')return themeMode;
  if(tg?.colorScheme)return tg.colorScheme==='light'?'day':'night';
  if(window.matchMedia?.('(prefers-color-scheme: light)').matches)return 'day';
  return 'night';
}
function applyThemeMode(){
  const t=resolveTheme();
  document.documentElement.setAttribute('data-theme',t);
  const meta=$('#themeColorMeta');
  if(meta)meta.setAttribute('content',t==='day'?'#f7f5f0':'#14100b');
  const btn=$('#btnTheme');
  if(btn)btn.textContent=t==='day'?'☀️':'🌙';
}
function setThemeMode(m){
  themeMode=m;
  try{localStorage.setItem('themeMode',m);}catch(e){}
  applyThemeMode();
}
applyThemeMode();
$('#btnTheme').onclick=()=>{
  haptic();
  const next=resolveTheme()==='day'?'night':'day';
  setThemeMode(next);
  toast(next==='day'?'☀️ Kunduzgi rejim':'🌙 Tungi rejim');
};

function skeletonShelf(){return `<div class="section"><div class="shead"><h2 class="skel" style="width:140px;height:16px;border-radius:6px"></h2></div><div class="shelf">${Array(4).fill('<div class="si"><div class="skel" style="height:170px;border-radius:14px"></div></div>').join('')}</div></div>`;}
async function boot(){
  if(tg){tg.ready();tg.expand();tg.BackButton?.onClick(()=>{if($('#sheet2').classList.contains('open'))closeSheet2();else if($('#sheet').classList.contains('open'))closeSheet();else if($('#globe').classList.contains('open'))closeGlobe();});applyThemeMode();tg.onEvent?.('themeChanged',()=>{if(themeMode==='system')applyThemeMode();});}
  if('serviceWorker' in navigator)window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
    // The shell/data caches are served cache-first-then-refresh, so a stale client can lag a
    // load behind a new deploy. Once a new SW actually takes control, force exactly one reload
    // so the fresh shell/JS is what actually runs. Guarded with sessionStorage (not a plain JS
    // variable, which resets on every reload and can't prevent a reload loop) so this fires at
    // most once per tab even if controllerchange happens to fire again after reloading.
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      let already=false;
      try{already=sessionStorage.getItem('swReloaded')==='1';}catch(e){}
      if(already)return;
      try{sessionStorage.setItem('swReloaded','1');}catch(e){}
      window.location.reload();
    });
  });
  // Most first loads land on the home view, not a filtered grid — show shimmer shelves
  // (matching what will actually render) instead of a generic grid skeleton.
  $('#home').style.display='block';
  $('#home').innerHTML=skeletonShelf()+skeletonShelf();
  $('.bar').style.display='none';
  try{
    const r=await fetch('./books.json',{cache:'no-cache'});DB=await r.json();
    byId={};for(const b of DB.books){byId[b.i]=b;indexBook(b);}
    buildHome();
  }catch(e){$('#count').textContent='';$('#grid').innerHTML='';$('#empty').style.display='block';$('#empty').innerHTML='<span class="em">⚠️</span>Ma\'lumot yuklanmadi';return;}
  await loadFavs();
  renderChips();run();
}
boot();
</script>
