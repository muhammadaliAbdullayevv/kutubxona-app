<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kutubxona</title>
<meta name="description" content="6000+ o'zbek va jahon kitoblari — qidiruv, mavzular, audiokitoblar.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14100b" id="themeColorMeta">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Night (default) — ink & brass, a library after closing time */
  :root{
    --bg:#14100b; --card:#1f1710; --card2:#291f14; --text:#f4ecdc; --muted:#a89172;
    --accent:#d9a441; --accent2:#b5672e; --line:#34281a; --chip:#241b12; --danger:#e2685a;
    --radius:16px; --shadow:0 6px 24px rgba(0,0,0,.5);
  }
  /* Day — parchment & ink */
  :root[data-theme="day"]{
    --bg:#f7f5f0; --card:#ffffff; --card2:#eeebe2; --text:#1e1b16; --muted:#726c5f;
    --accent:#2f6b4f; --accent2:#1f4d38; --line:#e3ded1; --chip:#eeebe2; --danger:#c0392b;
    --shadow:0 6px 20px rgba(30,25,15,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overscroll-behavior-y:none;
    transition:background-color .25s, color .25s}
  body,.book,.si,.card,header,.sheetc,.chip,.tab,.btn,.pill,.authchip{transition:background-color .25s, border-color .25s, color .25s}
  .wrap{max-width:760px; margin:0 auto; padding:12px 14px 90px}
  header{position:sticky; top:0; z-index:20; background:linear-gradient(180deg,var(--bg) 72%,transparent); padding:8px 14px 10px; margin:0 -14px 4px}
  h1{font-size:20px; font-weight:700; margin:2px 0 10px; letter-spacing:.2px}
  .searchbar{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px}
  .searchbar svg{flex:0 0 auto; opacity:.7}
  .searchbar input{flex:1; background:none; border:0; outline:none; color:var(--text); font-size:15px}
  .searchbar .clr{opacity:.5; padding:2px 4px; display:none; cursor:pointer}
  .mapbtn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:10px; padding:13px; border:0; border-radius:14px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-weight:800; font-size:14.5px; font-family:inherit; cursor:pointer; box-shadow:var(--shadow); transition:transform .15s}
  .mapbtn:active{transform:scale(.97)}
  .row{display:flex; gap:8px; align-items:center; overflow-x:auto; scrollbar-width:none; padding:10px 14px 2px; margin:0 -14px}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; background:var(--chip); border:1px solid var(--line); color:var(--muted); padding:7px 13px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; transition:.15s}
  .chip .n{opacity:.55; margin-left:4px}
  .chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent}
  .chip.on .n{opacity:.85}
  .tabs{display:flex; gap:6px; margin-top:2px}
  .tab{flex:1; text-align:center; padding:9px; border-radius:12px; font-weight:700; font-size:14px; color:var(--muted); background:var(--card); border:1px solid var(--line); cursor:pointer}
  .tab.on{color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent}
  .bar{display:flex; justify-content:space-between; align-items:center; margin:14px 2px 8px}
  .bar .lbl{font-size:13px; color:var(--muted); font-weight:600}
  .sort{background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:6px 8px; font-size:13px}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
  @keyframes cardIn{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
  .book,.si{animation:cardIn .4s cubic-bezier(.2,.8,.2,1) backwards; animation-delay:var(--d,0ms)}
  .book,.si,.chip,.tab,.btn,.authchip,.gtile{transition:transform .15s}
  .book:active,.si:active,.chip:active,.tab:active,.btn:active,.authchip:active,.gtile:active{transform:scale(.96)}
  @media (prefers-reduced-motion: reduce){.book,.si{animation:none!important}}
  .book{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; position:relative; display:flex; flex-direction:column}
  .cover{height:118px; display:flex; align-items:flex-end; padding:10px; position:relative}
  .cover .ini{font-size:30px; font-weight:800; color:rgba(255,255,255,.92); line-height:1; text-shadow:0 2px 8px rgba(0,0,0,.3)}
  .cover .aud{position:absolute; top:8px; right:8px; background:rgba(0,0,0,.35); border-radius:8px; padding:3px 7px; font-size:11px; font-weight:700; color:#fff}
  .ci{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .fav{position:absolute; top:8px; left:8px; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,.32); display:flex; align-items:center; justify-content:center; font-size:15px; z-index:2}
  .meta{padding:9px 10px 11px; display:flex; flex-direction:column; gap:4px; flex:1}
  .meta .t{font-weight:700; font-size:13.5px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .meta .a{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .meta .g{margin-top:auto; font-size:11px; color:var(--accent); font-weight:700}
  .meta .stats{display:flex; gap:8px; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
  .meta .stats b{color:var(--text)}
  .more{margin:18px auto 0; display:block; background:var(--card); border:1px solid var(--line); color:var(--text); padding:11px 22px; border-radius:12px; font-weight:700; font-size:14px}
  .empty{text-align:center; color:var(--muted); padding:60px 20px}
  .empty .em{font-size:40px; display:block; margin-bottom:10px}
  .skel{height:210px; border-radius:var(--radius); background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%); background-size:200% 100%; animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  /* Discovery homepage */
  .section{margin:18px 0 6px}
  .shead{display:flex; align-items:baseline; justify-content:space-between; margin:0 2px 10px}
  .shead h2{font-size:16px; font-weight:800; margin:0; letter-spacing:.2px}
  .shead .see{font-size:12.5px; font-weight:700; color:var(--accent); cursor:pointer; white-space:nowrap}
  .shelf{display:flex; gap:12px; overflow-x:auto; scrollbar-width:none; padding:2px 14px 6px; margin:0 -14px}
  .shelf::-webkit-scrollbar{display:none}
  .si{flex:0 0 128px; width:128px; cursor:pointer}
  .si .sc{height:170px; border-radius:14px; display:flex; align-items:flex-end; padding:9px; position:relative; box-shadow:var(--shadow)}
  .si .sc .ini{font-size:26px; font-weight:800; color:rgba(255,255,255,.92); text-shadow:0 2px 8px rgba(0,0,0,.3)}
  .si .sc .aud{position:absolute; top:7px; right:7px; background:rgba(0,0,0,.35); border-radius:7px; padding:2px 6px; font-size:11px}
  .si .st{font-size:12.5px; font-weight:700; line-height:1.25; margin:7px 1px 1px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .si .sa{font-size:11px; color:var(--muted); margin:0 1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .si .sr{font-size:11px; color:var(--muted); margin:2px 1px 0; font-variant-numeric:tabular-nums}
  .si .sr b{color:var(--text)}
  /* Auto-scrolling "recently added" ticker, top of home */
  .mqwrap{overflow-x:auto; scrollbar-width:none; padding:2px 0 6px; margin:0 -14px}
  .mqwrap::-webkit-scrollbar{display:none}
  .mqtrack{display:flex; gap:12px; width:max-content; padding:0 14px}
  .authchips{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px 14px 4px; margin:0 -14px}
  .authchips::-webkit-scrollbar{display:none}
  .authchip{flex:0 0 auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 13px; cursor:pointer; display:flex; flex-direction:column; gap:1px; min-width:110px}
  .authchip .an{font-size:13px; font-weight:700; white-space:nowrap}
  .authchip .ac{font-size:11px; color:var(--muted)}
  .genretiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .gtile{border-radius:14px; padding:14px; cursor:pointer; color:#fff; font-weight:800; font-size:15px; min-height:66px; display:flex; flex-direction:column; justify-content:center; box-shadow:var(--shadow)}
  .gtile .gc{font-size:12px; font-weight:600; opacity:.85; margin-top:3px}
  .sheet{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.5); display:none; align-items:flex-end}
  .sheet.open{display:flex}
  .sheetc{background:var(--bg); width:100%; max-width:760px; margin:0 auto; max-height:92vh; border-radius:22px 22px 0 0; overflow-y:auto; padding:0 0 24px; animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px); opacity:.6}to{transform:none; opacity:1}}
  .dhero{height:150px; display:flex; align-items:flex-end; padding:16px; position:relative}
  .dgrip{position:absolute; top:8px; left:50%; transform:translateX(-50%); width:38px; height:4px; border-radius:2px; background:rgba(255,255,255,.4)}
  .dhero .ini{font-size:44px; font-weight:800; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.35)}
  .dbody{padding:16px 18px 0}
  .dtitle{font-size:20px; font-weight:800; line-height:1.25; margin:0 0 4px}
  .dauthor{color:var(--muted); font-size:14px; margin-bottom:14px}
  .pills{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
  .pill{background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:12px; color:var(--muted); font-weight:600}
  .pill b{color:var(--text); font-weight:700}
  .sec{margin:16px 0}
  .sec h3{font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:0 0 6px}
  .sec p{margin:0; font-size:14.5px; line-height:1.6; white-space:pre-wrap}
  .subs{display:flex; flex-wrap:wrap; gap:6px}
  .sub{background:var(--card2); border-radius:8px; padding:4px 10px; font-size:12px; color:var(--accent); font-weight:600; cursor:pointer}
  .actions{position:sticky; bottom:0; background:linear-gradient(180deg,transparent,var(--bg) 24%); padding:16px 18px calc(16px + env(safe-area-inset-bottom)); display:flex; gap:10px; margin-top:8px}
  .btn{flex:1; border:0; border-radius:13px; padding:14px; font-weight:800; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff}
  .btn.ghost{flex:0 0 auto; width:52px; background:var(--card); border:1px solid var(--line); color:var(--text)}
  .btn.ghost.on{color:var(--danger)}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--card2); border:1px solid var(--line); color:var(--text); padding:11px 18px; border-radius:12px; font-weight:600; font-size:14px; opacity:0; transition:.25s; z-index:99; box-shadow:var(--shadow)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .hint{color:var(--muted); font-size:13px; margin:6px 0}
  .cmeta{font-size:12px; color:var(--muted); font-weight:700}
  /* Profile overlay (streaks/badges) */
  #sheet2{z-index:55}
  /* Book globe */
  #globe{align-items:stretch; background:var(--bg)}
  #libgame{align-items:stretch; background:var(--bg)}
  #globeCanvas{width:100%; height:100%; touch-action:none; display:block}
  .gclose{position:fixed; top:calc(env(safe-area-inset-top) + 14px); right:14px; width:36px; height:36px; border-radius:50%; background:var(--chip); border:1px solid var(--line); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; z-index:1}
  .gzoom{position:fixed; right:14px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px; z-index:1}
  .gzoom button{width:42px; height:42px; border-radius:50%; background:var(--chip); border:1px solid var(--line); color:var(--text); font-size:21px; font-weight:700; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); padding:0; line-height:1; transition:transform .15s}
  .gzoom button:active{transform:scale(.9)}
  #libgameCanvas{width:100%; height:100%; touch-action:none; display:block}
  .libctrls{position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom) + 16px); display:grid; grid-template-columns:repeat(3,50px); grid-template-rows:repeat(2,50px); gap:6px; z-index:1; touch-action:none}
  .libctrls button{border:1px solid var(--line); border-radius:14px; background:var(--chip); color:var(--text); font-size:19px; font-weight:700; font-family:inherit; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; box-shadow:var(--shadow); user-select:none}
  .libctrls button:active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff}
  #libUp{grid-column:2; grid-row:1}
  #libLeft{grid-column:1; grid-row:2}
  #libDown{grid-column:2; grid-row:2}
  #libRight{grid-column:3; grid-row:2}
  #libCarHud{position:fixed; left:0; right:0; bottom:0; height:24vh; pointer-events:none; z-index:1; display:none;
    background:linear-gradient(to top, rgba(0,0,0,.5), rgba(0,0,0,0));
    clip-path:polygon(0 100%, 0 38%, 16% 18%, 84% 18%, 100% 38%, 100% 100%);}
  #libgame.car #libCarHud{display:block}
  #libKnock{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 96px); transform:translateX(-50%) scale(.92);
    padding:12px 20px; border-radius:999px; border:1px solid var(--line); background:var(--accent); color:#fff;
    font-size:15px; font-weight:700; font-family:inherit; box-shadow:var(--shadow); z-index:2; cursor:pointer;
    display:none; opacity:0; transition:opacity .2s, transform .2s;}
  #libKnock.show{display:block; opacity:1; transform:translateX(-50%) scale(1); animation:libKnockPulse 1.3s ease-in-out infinite}
  @keyframes libKnockPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 0 9px rgba(0,0,0,0)}}
  #libChoice{position:fixed; inset:0; z-index:5; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55)}
  #libChoice.show{display:flex}
  .libChoiceCard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; width:min(320px,86vw); text-align:center; box-shadow:var(--shadow)}
  .libChoiceTitle{font-size:17px; font-weight:700; color:var(--text); margin-bottom:16px}
  .libChoiceCard button{display:block; width:100%; padding:14px; margin-top:10px; border-radius:14px; border:1px solid var(--line);
    background:var(--chip); color:var(--text); font-size:16px; font-weight:600; font-family:inherit; cursor:pointer}
  .libChoiceCard button:active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff}
  #libInteriorBack{position:fixed; left:14px; bottom:calc(env(safe-area-inset-bottom) + 16px); z-index:2; display:none;
    padding:10px 16px; border-radius:20px; border:1px solid var(--line); background:var(--chip); color:var(--text);
    font-size:14px; font-weight:600; font-family:inherit; box-shadow:var(--shadow); cursor:pointer}
  #libInteriorBack.show{display:block}
  #libGenreLabel{position:fixed; top:calc(env(safe-area-inset-top) + 14px); left:50%; transform:translateX(-50%); z-index:2;
    padding:7px 16px; border-radius:20px; background:rgba(0,0,0,.4); color:#fff; font-size:13px; font-weight:600;
    letter-spacing:.02em; display:none; pointer-events:none; backdrop-filter:blur(3px)}
  #libGenreLabel.show{display:block}
  .glegend{position:absolute; left:12px; bottom:calc(env(safe-area-inset-bottom) + 12px); display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted); max-height:44vh; overflow-y:auto; pointer-events:none; max-width:56%}
  .glegend .lg-row{display:flex; align-items:center; gap:6px; white-space:nowrap; text-shadow:0 1px 3px var(--bg)}
  .glegend .lg-row b{color:var(--text)}
  .glegend .lg-dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
  .streakbig{display:flex; align-items:baseline; gap:8px; margin:4px 0 2px}
  .streakbig .n{font-size:40px; font-weight:800; line-height:1}
  .streakbig .u{font-size:14px; color:var(--muted); font-weight:600}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0}
  .statgrid .st{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
  .statgrid .st .sv{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums}
  .statgrid .st .sl{font-size:11.5px; color:var(--muted); font-weight:600}
  .pill.locked{opacity:.35}
  /* Ratings (Play-Store-style 1-5 stars + review) */
  .ratehead{display:flex; align-items:center; gap:16px; margin-bottom:12px}
  .ratebig{font-size:36px; font-weight:800; line-height:1}
  .ratebig .of5{font-size:15px; color:var(--muted); font-weight:600}
  .ratestars{color:#ffb100; font-size:15px; letter-spacing:1px}
  .ratecount{font-size:12px; color:var(--muted)}
  .ratedist{flex:1; display:flex; flex-direction:column; gap:3px}
  .ratedist .drow{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted)}
  .ratedist .dbar{flex:1; height:6px; border-radius:3px; background:var(--chip); overflow:hidden}
  .ratedist .dbar i{display:block; height:100%; background:#ffb100; border-radius:3px}
  .starpick{font-size:26px; letter-spacing:4px; cursor:pointer; user-select:none}
  .starpick span{opacity:.3}
  .starpick span.on{opacity:1}
  #rForm{margin-top:10px}
  #rForm textarea{width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:9px; font:inherit; resize:vertical; min-height:50px; margin-top:8px; box-sizing:border-box}
  #rForm button{margin-top:6px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:0; border-radius:10px; padding:8px 14px; font-weight:700; cursor:pointer}
  #rForm .rdel{margin-left:10px; background:none; color:var(--danger); border:0; font-weight:700; cursor:pointer; padding:8px 4px}
  .rrow{padding:10px 0; border-top:1px solid var(--line)}
  .rrow:first-child{border-top:0}
  .rrow .rstars{color:#ffb100; font-size:13px}
  .rrow .rtext{font-size:14px; margin:4px 0 6px; white-space:pre-wrap}
  .rrow .rvote{display:flex; gap:14px; font-size:12.5px; color:var(--muted)}
  .rrow .rvote span{cursor:pointer}
  .rrow .rvote span.on{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 Kutubxona <a href="quran.html" style="float:right; font-size:13px; font-weight:700; color:var(--accent); text-decoration:none; background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:6px 13px; vertical-align:middle">📖 Qur'on</a><a id="btnProfile" style="float:right; margin-right:8px; font-size:13px; font-weight:700; color:var(--accent); text-decoration:none; background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:6px 13px; vertical-align:middle; cursor:pointer">👤</a><a id="btnTheme" style="float:right; margin-right:8px; font-size:13px; font-weight:700; color:var(--accent); text-decoration:none; background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:6px 13px; vertical-align:middle; cursor:pointer">☀️</a></h1>
    <div class="searchbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Kitob, muallif, mavzu…" autocomplete="off" enterkeyhint="search">
      <span class="clr" id="clr">✕</span>
    </div>
    <button class="mapbtn" id="btnGlobe">🌐 Kitoblar xaritasi</button>
    <button class="mapbtn" id="btnGame">🎮 Kutubxonaga sayohat</button>
    <div class="tabs">
      <div class="tab on" id="tabBrowse">Barchasi</div>
      <div class="tab" id="tabFav">❤️ Saqlanganlar</div>
    </div>
    <div class="row" id="genres"></div>
    <div class="row" id="filters"></div>
  </header>

  <div class="bar">
    <span class="lbl" id="count">Yuklanmoqda…</span>
    <select class="sort" id="sort">
      <option value="relevance">Moslik</option>
      <option value="newest">Yangi</option>
      <option value="popular">Mashhur</option>
      <option value="title">Alifbo</option>

<script>
const tg = window.Telegram?.WebApp;
const $ = s => document.querySelector(s);
const COMMUNITY_API_BASE = "https://pdf-audio-kitoblar.site";
// Sends the book straight into the user's chat with the bot (no deep link, no closing the
// Mini App) via the community API's cached file_id delivery. Rejects if there's no initData
// (opened outside Telegram) or the API call itself fails, so the caller can fall back to the
// classic deep-link + close behavior.
function deliverBook(id){
  if(!tg?.initData) return Promise.reject(new Error('no initData'));
  return fetch(COMMUNITY_API_BASE+'/api/books/'+encodeURIComponent(id)+'/deliver',{
    method:'POST',
    headers:{'Authorization':'tma '+tg.initData}
  }).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}
// Generic authenticated call to the community API — same Authorization convention as
// deliverBook, reused by discussion/profile/lists features. Auth header is only attached when
// initData exists, so anonymous callers hit read-only endpoints without it.
function api(path,opts){
  opts=opts||{};opts.headers=opts.headers||{};
  if(tg?.initData)opts.headers['Authorization']='tma '+tg.initData;
  if(opts.body)opts.headers['Content-Type']='application/json';
  return fetch(COMMUNITY_API_BASE+path,opts).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}
const canAct=()=>!!tg?.initData;
const COVERS=[['#c17a3d','#8c4a24'],['#a8452f','#6b2418'],['#4a6b4a','#2d4530'],['#c99a2e','#8a5c16'],['#5a4a6b','#382d45'],['#8a3a4a','#5c2530'],['#3a6b6b','#254545'],['#b06a2a','#6b3816'],['#6b5a3a','#453825']];
function coverFor(id){let h=0;const s=String(id||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return COVERS[h%COVERS.length];}
function initials(t){return String(t||'?').replace(/[^\p{L}\p{N} ]/gu,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'📖';}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// Uzbek Cyrillic -> Latin, so a Latin query matches a Cyrillic title and vice-versa.
const CYR={'а':'a','б':'b','в':'v','г':'g','ғ':'g','д':'d','е':'e','ё':'yo','ж':'j','з':'z','и':'i','й':'y','к':'k','қ':'q','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ў':'o','ф':'f','х':'x','ҳ':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':'','ь':'','э':'e','ю':'yu','я':'ya'};
// Canonical search key: lowercase, transliterate Cyrillic, drop apostrophes (o' == oʻ == ў),
// then keep letters/digits only. Both the query and the book text pass through this.
function canon(s){s=String(s||'').toLowerCase();let o='';for(const ch of s)o+=(CYR[ch]!==undefined?CYR[ch]:ch);return o.replace(/[ʻʼ'`'‘’ʼ]/g,'').replace(/[^\p{L}\p{N} ]/gu,' ').replace(/\s+/g,' ').trim();}
const norm=canon;
// True when strings are within one edit (insert/delete/substitute) — cheap typo tolerance.
function within1(a,b){if(a===b)return true;const la=a.length,lb=b.length;if(la===lb){const d=[];for(let k=0;k<la;k++)if(a[k]!==b[k]){d.push(k);if(d.length>2)break;}if(d.length===2&&d[1]===d[0]+1&&a[d[0]]===b[d[1]]&&a[d[1]]===b[d[0]])return true;}if(Math.abs(la-lb)>1)return false;let i=0,j=0,e=0;while(i<la&&j<lb){if(a[i]===b[j]){i++;j++;continue;}if(++e>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++;}}if(i<la||j<lb)e++;return e<=1;}
function indexBook(b){b._t=canon(b.t);b._a=canon(b.a);b._g=canon(b.g);b._sm=canon(b.sm);b._subs=canon((b.s||[]).join(' '));b._w=(b._t+' '+b._a).split(' ').filter(w=>w.length>=3);}

// var (not let) so the library-game module script — its own separate module scope — can read
// the loaded catalog via window.DB / window.byId for the interior bookshelf scene.
var DB={books:[],genres:[],audiences:[],types:[],bot:''};
var byId={};
let state={q:'',genre:'',audience:'',type:'',sort:'relevance',view:'browse',shown:24,result:[],all:false};
let HOME={newest:[],audio:[],authors:[],genres:[]};
let favs=new Set();
const PAGE=24;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
function haptic(x='light'){try{tg?.HapticFeedback?.impactOccurred(x)}catch(e){}}

// ---- favourites via Telegram CloudStorage (fallback: localStorage) ----
function cloudGet(){return new Promise(res=>{
  if(tg?.CloudStorage?.getItem){tg.CloudStorage.getItem('favs',(e,v)=>res(e?null:v));}
  else res(localStorage.getItem('favs'));
});}
function cloudSet(v){if(tg?.CloudStorage?.setItem)tg.CloudStorage.setItem('favs',v,()=>{});else localStorage.setItem('favs',v);}
async function loadFavs(){try{const v=await cloudGet();favs=new Set(v?JSON.parse(v):[]);}catch(e){favs=new Set();}}
function saveFavs(){cloudSet(JSON.stringify([...favs].slice(0,500)));}

// ---- search / filter / sort (all client-side) ----
function score(b,terms){
  if(b._t===undefined)indexBook(b);
  let sc=0;
  for(const term of terms){
    if(!term)continue;
    let s=0;
    if(b._t.startsWith(term))s=120;else if(b._t.includes(term))s=60;
    if(b._a.includes(term))s=Math.max(s,35);
    if(b._g.includes(term))s=Math.max(s,25);
    if(b._subs.includes(term))s=Math.max(s,20);
    if(b._sm.includes(term))s=Math.max(s,10);
    if(s===0&&term.length>=4){    // typo fallback: edit-distance<=1 vs title/author words
      for(const w of b._w){if(within1(w,term)){s=40;break;}}
    }
    if(s===0)return 0;           // every term must match somewhere (AND)
    sc+=s;
  }
  return sc;
}
function compute(){
  const terms=norm(state.q).split(/\s+/).filter(Boolean);
  let list;
  if(state.view==='favorites'){list=[...favs].map(id=>byId[id]).filter(Boolean);}
  else{list=DB.books;}
  let arr=[];
  for(const b of list){
    if(state.genre&&b.g!==state.genre)continue;
    if(state.audience&&b.au!==state.audience)continue;
    if(state.type&&((state.type==='audio')!==!!b.ha))continue;
    if(terms.length){const sc=score(b,terms);if(sc<=0)continue;b._s=sc;}
    arr.push(b);
  }
  if(terms.length&&state.sort==='relevance')arr.sort((x,y)=>y._s-x._s);
  else if(state.sort==='title')arr.sort((x,y)=>(x.t||'').localeCompare(y.t||'','uz'));
  else if(state.sort==='popular')arr.sort((x,y)=>(y.dl||0)-(x.dl||0));
  // 'newest' & default keep DB order (already newest-first)
  state.result=arr;state.shown=PAGE;
}

function chipRow(el,items,cur,key,fmt){

    const v=c.dataset.v; state[key]=(state[key]===v&&key!=='genre')?'':v; state.all=false; haptic(); renderChips(); run();
  });
}
function renderChips(){
  chipRow($('#genres'),DB.genres.map(x=>({v:x.v,l:x.v,c:x.c})),state.genre,'genre',x=>esc(x.l));

    DB.audiences.map(x=>`<span class="chip ${state.audience===x.v?'on':''}" data-k="audience" data-v="${esc(x.v)}">${esc(x.l)}<span class="n">${x.c}</span></span>`).join('');
  f.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const k=c.dataset.k;state[k]=state[k]===c.dataset.v?'':c.dataset.v;state.all=false;haptic();renderChips();run();});
}

function cardHtml(b,i){
  const[c1,c2]=coverFor(b.i);const fav=favs.has(b.i);

function fmtNum(n){n=n||0;return n>=1000?(n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'k':String(n);}
function render(){
  const grid=$('#grid');

  $('#count').textContent=state.result.length?`${state.result.length} ta ${noun}`:'';
}
// ---- discovery homepage (shown when browsing with no query/filter) ----
function buildHome(){
  HOME.newest=DB.books.slice(0,18);
  HOME.audio=DB.books.filter(b=>b.ha).slice(0,18);
  const ac={};
  for(const b of DB.books){const a=(b.a||'').trim();if(a&&a.length>1&&!/noma'?lum/i.test(a))ac[a]=(ac[a]||0)+1;}
  HOME.authors=Object.entries(ac).filter(([a,c])=>c>=2).sort((x,y)=>y[1]-x[1]).slice(0,16).map(([a,c])=>({a,c}));
  HOME.genres=DB.genres.slice(0,5).map(g=>({v:g.v,c:g.c,books:DB.books.filter(b=>b.g===g.v).slice(0,18)}));
}
function siHtml(b,i){const[c1,c2]=coverFor(b.i);return `<div class="si" data-id="${esc(b.i)}" style="--d:${Math.min(i||0,12)*30}ms"><div class="sc" style="background:linear-gradient(135deg,${c1},${c2})">${b.hc?`<img class="ci" src="covers/${encodeURIComponent(b.i)}.jpg" loading="lazy" onerror="this.remove()">`:''}${b.ha?'<span class="aud">🎧</span>':''}<span class="ini">${esc(initials(b.t))}</span></div><div class="st">${esc(b.t)}</div><div class="sa">${esc(b.a||'')}</div>${b.rc?`<div class="sr">⭐ <b>${b.rt}</b> (${b.rc})</div>`:''}</div>`;}
function shelf(title,books,see){return `<div class="section"><div class="shead"><h2>${esc(title)}</h2>${see?`<span class="see" ${see}>Barchasi →</span>`:''}</div><div class="shelf">${books.map((b,i)=>siHtml(b,i)).join('')}</div></div>`;}
function marqueeShelf(title,books,see){

  return `<div class="section"><div class="shead"><h2>${esc(title)}</h2>${see?`<span class="see" ${see}>Barchasi →</span>`:''}</div>

  </div>`;
}
function renderHome(){
  const h=$('#home');let html='';
  if(HOME.newest.length)html+=marqueeShelf("🆕 Yangi qo'shilgan",HOME.newest,'data-see="newest"');
  if(HOME.authors.length)html+=`<div class="section"><div class="shead"><h2>✍️ Mashhur mualliflar</h2></div><div class="authchips">${HOME.authors.map(a=>`<div class="authchip" data-auth="${esc(a.a)}"><span class="an">${esc(a.a)}</span><span class="ac">${a.c} ta kitob</span></div>`).join('')}</div></div>`;
  if(HOME.audio.length)html+=shelf("🎧 Audiokitoblar",HOME.audio,'data-see="audio"');
  for(const g of HOME.genres)html+=shelf(g.v,g.books,`data-see="genre" data-v="${esc(g.v)}"`);
  h.innerHTML=html;
  h.querySelectorAll('.si').forEach(el=>el.onclick=()=>openDetail(el.dataset.id));
  h.querySelectorAll('[data-auth]').forEach(el=>el.onclick=()=>{state.all=false;$('#q').value=el.dataset.auth;state.q=el.dataset.auth;$('#clr').style.display='block';haptic();run();window.scrollTo(0,0);});
  h.querySelectorAll('[data-see]').forEach(el=>el.onclick=()=>{const s=el.dataset.see;if(s==='newest'){state.all=true;state.sort='newest';$('#sort').value='newest';}else if(s==='audio'){state.type='audio';renderChips();}else if(s==='genre'){state.genre=el.dataset.v;renderChips();}haptic();run();window.scrollTo(0,0);});
}
// ---- gentle auto-scroll for the "recently added" ticker, native scroll underneath so a
// touch/swipe always fully overrides it (pauses the moment a finger touches it, resumes a
// couple seconds after release) ----
let mqPaused=false,mqResumeTimer=null;
const mqReduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
if(!mqReduced){
  (function mqTick(){
    const el=$('.mqwrap');
    if(el&&!mqPaused){
      el.scrollLeft+=1.6;
      const half=el.scrollWidth/2;
      if(half>0&&el.scrollLeft>=half)el.scrollLeft-=half;
    }
    requestAnimationFrame(mqTick);
  })();
  $('#home').addEventListener('pointerdown',e=>{if(e.target.closest('.mqwrap'))mqPaused=true;});
  window.addEventListener('pointerup',()=>{if(!mqPaused)return;clearTimeout(mqResumeTimer);mqResumeTimer=setTimeout(()=>{mqPaused=false;},2500);});
  window.addEventListener('pointercancel',()=>{if(!mqPaused)return;clearTimeout(mqResumeTimer);mqResumeTimer=setTimeout(()=>{mqPaused=false;},2500);});
}

// ---- book graph: live force-directed 2D cluster map of books (Canvas2D + hand-rolled
// physics — like an Obsidian/wiki graph view: nodes repel, edges spring-pull, genre-colored
// clusters emerge live on device). Node count is capped the same way the earlier sphere
// prototype was (~200-230 "anchor" books via popularity+genre-floor selection) specifically
// so the live O(n²) repulsion stays cheap (n≈220 => ~24k pairs/frame, trivial) regardless of
// the full ~5359-book catalog size — simulating the whole catalog live would not be safe on a
// phone, simulating this capped subset is.
// Popularity is extremely sparse in this catalog (most books have 0 downloads, almost none
// have ratings yet), so raw popularity alone would collapse into one giant tie-block and
// silently exclude sparse genres. hash31 (duplicated from coverFor()'s own formula, not
// refactored — keeps this feature's diff isolated from that working code) gives a stable
// tiebreak so "popular" is at least deterministic and genre-diverse rather than arbitrary
// array order.
function popScore(b){return (b.dl||0)*3 + (b.rc?b.rt*b.rc:0) + (b.hc?2:0);}
function hash31(s){let h=0;s=String(s||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
// "Unknown"/"Noma'lum" isn't a real author identity — 1023+ books share it, so treating it as
// one would falsely cluster a fifth of the catalog onto a single node.
function isKnownAuthor(a){return !!a && !/unknown|noma.?lum/i.test(a);}
const CLUSTER_COLORS=['#4f8fd9','#e0824a','#4caf7d','#a066c9','#2fa6a6','#d9527a','#c9a227','#7d6ad9','#5ba64f','#4aa8c9','#c96f3f','#8f9bb3','#b3853f','#5f9bd9','#6fae8f'];
const GLOBE={built:false,nodes:[],edges:[],hubs:[],projected:[],genreColor:{},highlightGenre:null,panX:0,panY:0,zoom:1,raf:null};
function buildGlobe(){
  const byGenre={};
  for(const b of DB.books){(byGenre[b.g||'?']=byGenre[b.g||'?']||[]).push(b);}
  const total=DB.books.length||1;
  let anchors=[];
  for(const g in byGenre){
    const bucket=byGenre[g];
    const k=Math.max(6,Math.round(200*bucket.length/total));
    const sorted=bucket.slice().sort((x,y)=>{
      const d=popScore(y)-popScore(x);
      return d!==0?d:hash31(x.i)-hash31(y.i);
    });
    anchors=anchors.concat(sorted.slice(0,k));
  }
  const genreColor={};
  let colorIdx=0;
  for(const b of anchors){
    const g=b.g||'?';
    if(!(g in genreColor)){genreColor[g]=CLUSTER_COLORS[colorIdx%CLUSTER_COLORS.length];colorIdx++;}
  }
  const idIndex={};
  const nodes=anchors.map((b,i)=>{
    idIndex[b.i]=i;
    const ang=(hash31(b.i)%6283)/1000, rad=20+(hash31(b.i+'#r')%120);
    return {id:b.i,t:b.t,g:b.g||'?',pop:popScore(b),
      x:Math.cos(ang)*rad,y:Math.sin(ang)*rad,vx:0,vy:0,color:genreColor[b.g||'?']};
  });
  // Edges: within each genre bucket (sorted by popularity), connect each anchor to its 2
  // nearest neighbors in that ordering — gives every node a couple of same-genre "cousins"
  // without an O(bucket²) all-to-all hairball. Plus same-author pairs across genres, if any.
  const edges=[], seen=new Set();
  function addEdge(i,j){
    if(i===j||i==null||j==null)return;
    const key=i<j?i+'_'+j:j+'_'+i;
    if(seen.has(key))return;
    seen.add(key);edges.push([i,j]);
  }
  for(const g in byGenre){
    const bucket=byGenre[g].filter(b=>idIndex[b.i]!==undefined).sort((x,y)=>popScore(y)-popScore(x));
    for(let i=0;i<bucket.length;i++){
      const a=idIndex[bucket[i].i];
      if(i+1<bucket.length)addEdge(a,idIndex[bucket[i+1].i]);
      if(i+2<bucket.length)addEdge(a,idIndex[bucket[i+2].i]);
    }
  }
  const byAuthorAnchor={};
  for(const b of anchors){if(isKnownAuthor(b.a))(byAuthorAnchor[b.a]=byAuthorAnchor[b.a]||[]).push(b);}
  for(const a in byAuthorAnchor){
    const arr=byAuthorAnchor[a];
    for(let i=1;i<arr.length;i++)addEdge(idIndex[arr[0].i],idIndex[arr[i].i]);
  }
  // Satellites: every other book in the catalog (~5100+), NOT individually simulated (that
  // would blow the O(n²) repulsion budget) — each just rides along at its parent anchor's
  // live (already-simulated) position plus a small fixed jitter, so the full catalog has
  // visual presence without extra physics cost. Revealed once zoomed in a bit (see
  // globeDraw), matching "popular books by default, more as you zoom into a cluster."
  const anchorIdSet=new Set(anchors.map(a=>a.i));
  const primaryAnchorByAuthor={};
  for(const b of anchors){if(isKnownAuthor(b.a) && !(b.a in primaryAnchorByAuthor))primaryAnchorByAuthor[b.a]=b.i;}
  // Genre fallback: a book whose author has no anchor gets hash-distributed across ALL of its
  // genre's anchors (not dumped onto a single "top" one) — otherwise nearly every satellite in
  // a genre piles onto one node, since most authors only have 1-2 books and rarely have an
  // anchor of their own.
  const anchorsByGenre={};
  for(const g in byGenre){
    anchorsByGenre[g]=anchors.filter(a=>(a.g||'?')===g); // already popScore-sorted from above
  }
  const satellites=[];
  for(const b of DB.books){
    if(anchorIdSet.has(b.i))continue;
    let parentId=isKnownAuthor(b.a) && primaryAnchorByAuthor[b.a];
    if(!parentId){
      const bucket=anchorsByGenre[b.g||'?'];
      if(bucket && bucket.length)parentId=bucket[hash31(b.i+'#gp')%bucket.length].i;
    }
    if(!parentId)continue;
    const parentIdx=idIndex[parentId];
    const jAng=(hash31(b.i+'#sat')%6283)/1000, jRad=4+(hash31(b.i+'#satr')%10);
    satellites.push({id:b.i,t:b.t,parentIdx,jx:Math.cos(jAng)*jRad,jy:Math.sin(jAng)*jRad,color:nodes[parentIdx].color});
  }
  GLOBE.nodes=nodes;
  GLOBE.satellites=satellites;
  GLOBE.edges=edges;
  GLOBE.genreColor=genreColor;
  GLOBE.built=true;
  renderGlobeLegend(byGenre);
}
function renderGlobeLegend(byGenre){
  const el=$('#globeLegend');
  if(!el)return;
  const rows=Object.keys(GLOBE.genreColor)
    .sort((a,b)=>(byGenre[b]?.length||0)-(byGenre[a]?.length||0))
    .map(g=>`<div class="lg-row"><span class="lg-dot" style="background:${GLOBE.genreColor[g]}"></span>${esc(g)} <b>${byGenre[g]?byGenre[g].length:0}</b></div>`)
    .join('');
  el.innerHTML=rows;
}
function globeSimStep(){
  const nodes=GLOBE.nodes, n=nodes.length;
  for(let i=0;i<n;i++){
    const A=nodes[i];
    for(let j=i+1;j<n;j++){
      const B=nodes[j];
      let dx=A.x-B.x, dy=A.y-B.y, distSq=dx*dx+dy*dy;
      // Softened minimum distance (not just clamped to 1): without this, two nodes that ever
      // land close together spike the force toward its ceiling and fling both away violently
      // (exactly what "moving so fast, can't see anything" was — dividing by a near-zero
      // distSq). Flooring at 100 (~10px) caps the worst-case force instead of letting it blow up.
      if(distSq<100)distSq=100;
      const dist=Math.sqrt(distSq), force=95/distSq;
      const fx=(dx/dist)*force, fy=(dy/dist)*force;
      A.vx+=fx;A.vy+=fy;B.vx-=fx;B.vy-=fy;
    }
  }
  for(const [i,j] of GLOBE.edges){
    const A=nodes[i],B=nodes[j];
    const dx=B.x-A.x,dy=B.y-A.y,dist=Math.sqrt(dx*dx+dy*dy)||0.01;
    const force=(dist-24)*0.018;
    const fx=(dx/dist)*force,fy=(dy/dist)*force;
    A.vx+=fx;A.vy+=fy;B.vx-=fx;B.vy-=fy;
  }
  // Centering needs to scale with node count — with ~220 anchors each pushed by ~220 others,
  // a fixed weak pull loses that tug-of-war and the whole graph drifts apart into empty space —
  // but too strong (an earlier attempt) overshoots and oscillates instead of settling.
  for(const A of nodes){A.vx-=A.x*0.011;A.vy-=A.y*0.011;}
  // Hard velocity cap: a safety net independent of the exact force constants above — whatever
  // the net force on a node comes out to, it can never move faster than this per frame, so a
  // parameter combination that's slightly too strong degrades to "settles a bit slower"
  // instead of "flies off screen."
  const MAX_SPEED=5;
  for(const A of nodes){
    A.vx*=0.78;A.vy*=0.78;
    const sp=Math.hypot(A.vx,A.vy);
    if(sp>MAX_SPEED){A.vx=A.vx/sp*MAX_SPEED;A.vy=A.vy/sp*MAX_SPEED;}
    A.x+=A.vx;A.y+=A.vy;
  }
}
function globeDraw(){
  const canvas=$('#globeCanvas');
  if(!canvas)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  }
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const cx=w/2+GLOBE.panX, cy=h/2+GLOBE.panY, s=GLOBE.zoom;
  const style=getComputedStyle(document.documentElement);
  const lineColor=style.getPropertyValue('--line').trim()||'#34281a';
  const textColor=style.getPropertyValue('--text').trim()||'#f4ecdc';
  const proj={};
  for(const A of GLOBE.nodes)proj[A.id]={sx:cx+A.x*s,sy:cy+A.y*s};
  const dim=g=>GLOBE.highlightGenre && g!==GLOBE.highlightGenre;

  // Layer 1: one hub per genre/type ("the main header"), positioned at the live centroid of
  // that genre's anchors (Layer 2) — recomputed fresh each frame (cheap: ~18 genres), so it
  // naturally stays in the middle of its cluster without its own physics. Tapping a hub
  // toggles a highlight (see onHubTap) that traces its lines/books, dimming everything else.
  const byGenreNodes={};
  for(const A of GLOBE.nodes)(byGenreNodes[A.g]=byGenreNodes[A.g]||[]).push(A);
  const hubs=[];
  for(const g in byGenreNodes){
    const arr=byGenreNodes[g];
    let hx=0,hy=0;
    for(const A of arr){hx+=A.x;hy+=A.y;}
    hubs.push({g,x:hx/arr.length,y:hy/arr.length,color:GLOBE.genreColor[g],anchors:arr});
  }
  GLOBE.hubs=hubs;

  // hub -> Layer-2 (anchor) spokes
  ctx.lineWidth=1;
  for(const H of hubs){
    const hx=cx+H.x*s, hy=cy+H.y*s, on=GLOBE.highlightGenre===H.g;
    ctx.globalAlpha=dim(H.g)?0.05:(on?0.55:0.22);
    ctx.strokeStyle=H.color;
    for(const A of H.anchors){
      const p=proj[A.id];
      ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(p.sx,p.sy);ctx.stroke();
    }
  }
  // Layer-2 <-> Layer-2 edges (same-genre neighbors / same-author pairs)
  ctx.strokeStyle=lineColor;
  const edgeBase=Math.min(0.4,0.18+(s-1)*0.08); // fainter overview, fuller once zoomed in
  for(const [i,j] of GLOBE.edges){
    const A=GLOBE.nodes[i],B=GLOBE.nodes[j];
    ctx.globalAlpha=dim(A.g)?0.05:(GLOBE.highlightGenre===A.g?0.6:edgeBase);
    const pa=proj[A.id],pb=proj[B.id];
    ctx.beginPath();ctx.moveTo(pa.sx,pa.sy);ctx.lineTo(pb.sx,pb.sy);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Layer 2: anchor books
  GLOBE.projected=[];
  for(const A of GLOBE.nodes){
    const p=proj[A.id];
    const r=(2.6+Math.min(3,Math.sqrt(A.pop+1)*0.6))*Math.min(1.5,Math.max(0.55,s));
    ctx.globalAlpha=dim(A.g)?0.15:1;
    ctx.fillStyle=A.color;
    ctx.beginPath();ctx.arc(p.sx,p.sy,r,0,Math.PI*2);ctx.fill();
    GLOBE.projected.push({id:A.id,sx:p.sx,sy:p.sy,r});
  }
  ctx.globalAlpha=1;

  // Layer 3: the rest of the catalog, riding along at their live parent's position. Every book
  // is always technically present (so it's reachable/tappable), but faded low at the overview
  // zoom and fading in as you zoom toward a cluster — full dot-clutter right from the default
  // view was what made it feel messy; a gradual reveal keeps "all books are there" true while
  // the overview itself stays calm.
  const satAlpha=Math.min(0.65,0.1+(s-1)*0.12);
  for(const S of GLOBE.satellites){
    const P=GLOBE.nodes[S.parentIdx];
    const sx=cx+(P.x+S.jx)*s, sy=cy+(P.y+S.jy)*s;
    if(sx<-30||sx>w+30||sy<-30||sy>h+30)continue; // cheap off-screen cull
    const r=1.6*Math.min(1.5,Math.max(0.6,s));
    ctx.globalAlpha=dim(P.g)?0.08:satAlpha;
    ctx.fillStyle=S.color;
    ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fill();
    GLOBE.projected.push({id:S.id,sx,sy,r:Math.max(r,8)}); // generous tap radius despite tiny draw size
  }
  ctx.globalAlpha=1;

  // hub circles + names, drawn last so they always sit on top as the permanent "headers"
  ctx.textAlign='center';
  for(const H of hubs){
    const hx=cx+H.x*s, hy=cy+H.y*s;
    if(hx<-40||hx>w+40||hy<-40||hy>h+40)continue;
    const on=GLOBE.highlightGenre===H.g, r=on?9:7;
    ctx.globalAlpha=1;
    ctx.fillStyle=H.color;
    ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=textColor;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.stroke();
    ctx.font='bold 12px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle=textColor;
    ctx.fillText(H.g,hx,hy-r-6);
    GLOBE.projected.unshift({id:'hub:'+H.g,sx:hx,sy:hy,r:16}); // unshift: hubs win hit-test ties
  }

  // book titles: a small, readable set at the overview zoom, growing gradually as you zoom
  // in — jumping straight from "top 15" to "all 221" at a small zoom was the main source of
  // clutter, since 221 labels can't all be readable at once regardless of how sparse the dots
  // are. Layer-3 satellite titles only start appearing once zoomed in well past that.
  ctx.font='11px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillStyle=textColor;
  const anchorLabelCount=Math.round(Math.min(221,12+Math.max(0,s-1)*55));
  const anchorPool=GLOBE.nodes.slice().sort((a,b)=>b.pop-a.pop).slice(0,anchorLabelCount);
  for(const A of anchorPool){
    if(dim(A.g))continue;
    const p=proj[A.id];
    if(p.sx<-20||p.sx>w+20||p.sy<-20||p.sy>h+20)continue;
    let title=A.t||'';if(title.length>16)title=title.slice(0,15)+'…';
    ctx.fillText(title,p.sx,p.sy+13);
  }
  if(s>2.4){
    const satLabelCap=Math.round(Math.min(60,(s-2.4)*22));
    let labeled=0;
    for(const S of GLOBE.satellites){
      if(labeled>=satLabelCap)break;
      const P=GLOBE.nodes[S.parentIdx];
      if(dim(P.g))continue;
      const sx=cx+(P.x+S.jx)*s, sy=cy+(P.y+S.jy)*s;
      if(sx<-10||sx>w+10||sy<-10||sy>h+10)continue;
      let title=S.t||'';if(title.length>14)title=title.slice(0,13)+'…';
      ctx.fillText(title,sx,sy+9);
      labeled++;
    }
  }
}
function globeTick(){
  // Physics stays paused for a few seconds of stillness after any touch, not just during the
  // touch itself — resuming the instant a finger lifts made it hard to actually tap a book
  // right after zooming/panning to it, since the nodes would already be sliding away again.
  if(!globeSimPaused)globeSimStep();
  globeDraw();
  GLOBE.raf=requestAnimationFrame(globeTick);
}
function hitTestGlobe(clientX,clientY){
  const canvas=$('#globeCanvas');
  const rect=canvas.getBoundingClientRect();
  const x=clientX-rect.left, y=clientY-rect.top;
  let best=null,bestD=18*18; // 18px tap-target radius, squared (compared against squared dist)
  for(const p of GLOBE.projected){
    const dx=p.sx-x, dy=p.sy-y, d=dx*dx+dy*dy;
    if(d<bestD){bestD=d;best=p;}
  }
  return best;
}

const globePointers=new Map();
let globeDrag=null, globePinch=null, globeSimPaused=false, globeResumeTimer=null;
const GLOBE_RESUME_DELAY=3000; // how long the map holds still after you let go, so there's a
                                 // real window to actually tap a book before it drifts again
// Zooms toward a specific screen point (pinch midpoint, cursor position, or canvas center for
// the +/- buttons) instead of always toward the canvas center — keeps whatever you're actually
// looking at under your fingers/cursor as it grows, like any normal map.
function zoomToward(px,py,newZoom){
  const canvas=$('#globeCanvas');
  if(!canvas)return;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  newZoom=Math.max(0.4,Math.min(26,newZoom));
  const wx=(px-(w/2+GLOBE.panX))/GLOBE.zoom, wy=(py-(h/2+GLOBE.panY))/GLOBE.zoom;
  GLOBE.zoom=newZoom;
  GLOBE.panX=px-w/2-wx*newZoom;
  GLOBE.panY=py-h/2-wy*newZoom;
}
function globePauseThenResume(){
  globeSimPaused=true;
  clearTimeout(globeResumeTimer);
  globeResumeTimer=setTimeout(()=>{globeSimPaused=false;},GLOBE_RESUME_DELAY);
}
function wireGlobeInteraction(){
  const canvas=$('#globeCanvas');
  function pinchDist(){const pts=[...globePointers.values()];return pts.length<2?0:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);}
  function pinchMid(){
    const pts=[...globePointers.values()];
    const rect=canvas.getBoundingClientRect();
    return {x:(pts[0].x+pts[1].x)/2-rect.left, y:(pts[0].y+pts[1].y)/2-rect.top};
  }
  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    globeSimPaused=true;
    clearTimeout(globeResumeTimer);
    globePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(globePointers.size===1){
      globeDrag={x0:e.clientX,y0:e.clientY,panX0:GLOBE.panX,panY0:GLOBE.panY,moved:false};
    } else if(globePointers.size===2){
      globeDrag=null;
      globePinch={d0:pinchDist(),zoom0:GLOBE.zoom};
    }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!globePointers.has(e.pointerId))return;
    globePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(globePinch && globePointers.size>=2){
      const d=pinchDist();
      if(d>0&&globePinch.d0>0){
        const mid=pinchMid();
        zoomToward(mid.x,mid.y,globePinch.zoom0*(d/globePinch.d0));
      }
      return;
    }
    if(!globeDrag)return;
    const dx=e.clientX-globeDrag.x0, dy=e.clientY-globeDrag.y0;
    if(!globeDrag.moved && Math.hypot(dx,dy)>6)globeDrag.moved=true;
    GLOBE.panX=globeDrag.panX0+dx;
    GLOBE.panY=globeDrag.panY0+dy;
  });
  function release(e){
    if(globePointers.has(e.pointerId)){
      if(globePointers.size===1 && globeDrag && !globeDrag.moved){
        const hit=hitTestGlobe(e.clientX,e.clientY);
        if(hit)onGlobeTap(hit.id);
      }
      globePointers.delete(e.pointerId);
    }
    // Lifting one finger out of a 2-finger pinch used to leave BOTH globeDrag and globePinch
    // null while the other finger was still down — physics would resume mid-touch and the
    // remaining finger stopped panning, which read as the map "breaking"/jumping right as you
    // let go. Hand off to a fresh drag anchored at the remaining finger instead.
    if(globePointers.size>=2){
      globePinch={d0:pinchDist(),zoom0:GLOBE.zoom};
      globeDrag=null;
    } else if(globePointers.size===1){
      globePinch=null;
      const remaining=[...globePointers.values()][0];
      globeDrag={x0:remaining.x,y0:remaining.y,panX0:GLOBE.panX,panY0:GLOBE.panY,moved:true};
    } else {
      globePinch=null;
      globeDrag=null;
      globePauseThenResume(); // fully released — hold still before the sim drifts again
    }
  }
  canvas.addEventListener('pointerup',release);
  canvas.addEventListener('pointercancel',release);
  canvas.addEventListener('wheel',e=>{
    const rect=canvas.getBoundingClientRect();
    zoomToward(e.clientX-rect.left,e.clientY-rect.top,GLOBE.zoom-e.deltaY*0.0015);
    e.preventDefault();
    globePauseThenResume();
  },{passive:false});
  $('#globeZoomIn').onclick=()=>{
    const canvas=$('#globeCanvas');
    zoomToward(canvas.clientWidth/2,canvas.clientHeight/2,GLOBE.zoom*1.35);
    haptic();globePauseThenResume();
  };
  $('#globeZoomOut').onclick=()=>{
    const canvas=$('#globeCanvas');
    zoomToward(canvas.clientWidth/2,canvas.clientHeight/2,GLOBE.zoom/1.35);
    haptic();globePauseThenResume();
  };
}

}

<script type="module">
// Library adventure mini-game: real first-person 3D via Three.js (ES module — the rest of this
// file is one classic script, so this piece needs its own type="module" tag). Camera sits at
// eye height (the screen IS the character's point of view), GTA-1-style turn/forward/back

// entry point in the app uses.
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const LG_WORLD = { halfX: 90, zMin: -70, zMax: 90, spawnZ: 70, libZ: -40 };

const LG_KNOCK_DIST = 7;

// Natural environment colors, independent of the app's flat UI accent tokens — grass, brick and
// wood shouldn't be rendered in the same palette as buttons and chips.
const LG_PALETTE = {
  day: {
    sky1: '#bfe0f7', sky2: '#f2f9ff', fog: '#d7ecfa', sun: '#fff3d6',
    grass1: '#5f8f4c', grass2: '#436b38',
    path1: '#b3a892', path2: '#8f8270',
    wall: '#c98a4c', wallDark: '#a06a34', roof: '#8a3f30', column: '#e9dfc9',
    door: '#4a3320', windowLit: '#fff0b0',
    woodFloor1: '#a06b3c', woodFloor2: '#7a4e28', shelfWood: '#6f4526', wallInterior: '#d8b688',
    ceiling: '#e7d9bd', lamp: '#fff2c8', text: '#3a2717',
    treeFoliage: ['#4c7a3e', '#3f6b34', '#5a8a4a'],
  },
  night: {
    sky1: '#0a1230', sky2: '#1c2a4d', fog: '#0d1733', sun: '#8fa5ff',
    grass1: '#1e2e1c', grass2: '#152213',
    path1: '#39352d', path2: '#2a2721',
    wall: '#6b4a2c', wallDark: '#43301c', roof: '#3a2019', column: '#8f8368',
    door: '#180f08', windowLit: '#ffd97a',
    woodFloor1: '#3c2716', woodFloor2: '#2a1a0d', shelfWood: '#2c1c10', wallInterior: '#4a3722',
    ceiling: '#221808', lamp: '#ffcf82', text: '#f1e6d2',
    treeFoliage: ['#1e3018', '#182812', '#243a1e'],
  },
};
// The game always renders in daylight regardless of the app's own day/night theme toggle —
// a dim library at 9pm isn't the point; the night palette stays defined but unused for now.
function lgPalette() {
  return LG_PALETTE.day;
}

// Foot vs. car changes feel, not just top speed — a car accelerates/brakes more gradually
// (heavier) and turns less sharply than a person can pivot on foot; indoors everyone walks.
const LG_MODE_CFG = {
  foot: { maxSpeed: 9, accel: 24, decel: 30, turnRate: 1.8, bobAmp: 0.045 },
  car: { maxSpeed: 24, accel: 14, decel: 20, turnRate: 1.0, bobAmp: 0.015 },
  inside: { maxSpeed: 4, accel: 16, decel: 22, turnRate: 2.0, bobAmp: 0.03 },
};

const LG = {
  x: 0, z: LG_WORLD.spawnZ, yaw: 0, speed: 0, walk: 0,
  mode: null, outdoorMode: 'foot', inside: false, nearDoor: false, atDoor: false,
  keys: { fwd: false, back: false, left: false, right: false },
  raf: null, lastTs: 0, built: false, interiorBuilt: false, wired: false,
  renderer: null, camera: null, outdoorScene: null, interiorScene: null, activeScene: null,
  door: null, bookMeshes: [], bookInstanceIds: [], shelfZones: [],
};

// ---- hand-generated procedural textures (no art assets — canvas patterns tiled via THREE.RepeatWrapping) ----
function lgNoiseTexture(base, spots, size, repeat) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const c = canvas.getContext('2d');
  c.fillStyle = base; c.fillRect(0, 0, size, size);
  for (const [color, count, alpha, rMin, rMax] of spots) {
    c.globalAlpha = alpha; c.fillStyle = color;
    for (let n = 0; n < count; n++) {
      const x = Math.random() * size, y = Math.random() * size, r = rMin + Math.random() * (rMax - rMin);
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    }
  }
  c.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function lgGrainTexture(base, lineColor, size, lines, repeat) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const c = canvas.getContext('2d');
  c.fillStyle = base; c.fillRect(0, 0, size, size);
  c.strokeStyle = lineColor; c.globalAlpha = 0.35;
  for (let i = 0; i < lines; i++) {
    const y = Math.random() * size;
    c.lineWidth = 1 + Math.random() * 1.5;
    c.beginPath(); c.moveTo(0, y);
    c.bezierCurveTo(size * 0.3, y + (Math.random() - 0.5) * 8, size * 0.7, y + (Math.random() - 0.5) * 8, size, y);
    c.stroke();
  }
  c.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function lgBrickTexture(base, mortar, size, repeatX, repeatY) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const c = canvas.getContext('2d');
  c.fillStyle = base; c.fillRect(0, 0, size, size);
  c.strokeStyle = mortar; c.lineWidth = 2; c.globalAlpha = 0.5;
  const rows = 6, bh = size / rows;
  for (let r = 0; r <= rows; r++) { c.beginPath(); c.moveTo(0, r * bh); c.lineTo(size, r * bh); c.stroke(); }
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) * (size / 8);
    for (let x = off; x < size + size / 4; x += size / 4) { c.beginPath(); c.moveTo(x, r * bh); c.lineTo(x, (r + 1) * bh); c.stroke(); }
  }
  c.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX, repeatY);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function lgLabelSprite(text, color, w = 512, h = 128, fontSize = 56) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const c = canvas.getContext('2d');
  c.font = `700 ${fontSize}px system-ui, sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = color;
  c.fillText(text, w / 2, h / 2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set((w / h) * 4, 4, 1);
  return sprite;
}
function lgSky(pal) {
  const geo = new THREE.SphereGeometry(400, 24, 16);
  const mat = new THREE.ShaderMaterial({
    uniforms: { top: { value: new THREE.Color(pal.sky1) }, bottom: { value: new THREE.Color(pal.sky2) } },
    vertexShader: `varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vPos; uniform vec3 top; uniform vec3 bottom; void main(){ float h=clamp(normalize(vPos).y*0.6+0.4,0.0,1.0); gl_FragColor=vec4(mix(bottom,top,h),1.0); }`,
    side: THREE.BackSide, depthWrite: false,
  });
  return new THREE.Mesh(geo, mat);
}
function lgTree(pal, seed) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.26, 2.4, 6), new THREE.MeshStandardMaterial({ color: pal.woodFloor2, roughness: 0.9 }));
  trunk.position.y = 1.2; trunk.castShadow = true;
  g.add(trunk);
  const foliageColor = pal.treeFoliage[seed % pal.treeFoliage.length];
  const foliage = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5 + (seed % 3) * 0.2, 0), new THREE.MeshStandardMaterial({ color: foliageColor, roughness: 0.95, flatShading: true }));
  foliage.position.y = 3.2; foliage.castShadow = true;
  g.add(foliage);
  return g;
}
// Same hash formula as the app's own coverFor() (duplicated on purpose, not shared — keeps this
// module's diffs isolated from the classic script), used to tint each instanced book spine so
// thousands of books still read as visually distinct without a unique texture each.
const LG_COVERS = [0xc17a3d, 0xa8452f, 0x4a6b4a, 0xc99a2e, 0x5a4a6b, 0x8a3a4a, 0x3a6b6b, 0xb06a2a, 0x6b5a3a];
function lgHashColor(id) {
  let h = 0; const s = String(id || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return LG_COVERS[h % LG_COVERS.length];
}

function lgBuildOutdoor(pal) {
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(pal.fog, 45, 190);
  scene.add(lgSky(pal));

  // Three.js (r155+) uses physically-correct light units by default, where the old "looks fine
  // at intensity ~1" values render almost pitch black — these need to be an order of magnitude
  // higher, plus a baseline ambient so nothing ever goes fully unlit.
  scene.add(new THREE.AmbientLight(pal.sky1, 1.2));
  scene.add(new THREE.HemisphereLight(pal.sky1, pal.grass1, 2.2));
  const sun = new THREE.DirectionalLight(pal.sun, 3.4);
  sun.position.set(45, 65, 25);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 160 });
  scene.add(sun);

  const grassTex = lgNoiseTexture(pal.grass1, [[pal.grass2, 900, 0.5, 1, 2.5], ['#00000022', 250, 0.15, 1, 3]], 256, 30);
  const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(220, 200), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
  groundMesh.rotation.x = -Math.PI / 2;
  groundMesh.receiveShadow = true;
  scene.add(groundMesh);

  const pathTex = lgNoiseTexture(pal.path1, [[pal.path2, 500, 0.4, 1, 2]], 256, 8);
  const pathLen = LG_WORLD.spawnZ - LG_WORLD.libZ + 20;
  const pathMesh = new THREE.Mesh(new THREE.PlaneGeometry(9, pathLen), new THREE.MeshStandardMaterial({ map: pathTex, roughness: 0.9 }));
  pathMesh.rotation.x = -Math.PI / 2;
  pathMesh.position.set(0, 0.01, (LG_WORLD.spawnZ + LG_WORLD.libZ) / 2);
  pathMesh.receiveShadow = true;
  scene.add(pathMesh);

  const brickTex = lgBrickTexture(pal.wall, pal.wallDark, 256, 4, 3);
  const lib = new THREE.Group();
  lib.position.set(0, 0, LG_WORLD.libZ);
  const body = new THREE.Mesh(new THREE.BoxGeometry(18, 14, 18), new THREE.MeshStandardMaterial({ map: brickTex, roughness: 0.9 }));
  body.position.y = 7; body.castShadow = true; body.receiveShadow = true;
  lib.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(14.5, 8, 4), new THREE.MeshStandardMaterial({ color: pal.roof, roughness: 0.6 }));
  roof.rotation.y = Math.PI / 4; roof.position.y = 14 + 4; roof.castShadow = true;
  lib.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(4, 6.5, 0.4), new THREE.MeshStandardMaterial({ color: pal.door, roughness: 0.6, transparent: true, opacity: 1 }));
  door.position.set(0, 3.25, 9.05);
  lib.add(door);
  LG.door = door;
  const winMat = new THREE.MeshStandardMaterial({ color: pal.windowLit, roughness: 0.3, emissive: pal.windowLit, emissiveIntensity: 0.6 });
  const win1 = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.3), winMat);
  win1.position.set(-6.5, 8.5, 9.05);
  lib.add(win1);
  const win2 = win1.clone(); win2.position.x = 6.5; lib.add(win2);
  const colMat = new THREE.MeshStandardMaterial({ color: pal.column, roughness: 0.8 });
  const col1 = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.55, 7.2, 10), colMat);
  col1.position.set(-4.6, 3.6, 9.3); col1.castShadow = true;
  lib.add(col1);
  const col2 = col1.clone(); col2.position.x = 4.6; lib.add(col2);
  const label = lgLabelSprite('📚 Kutubxona', pal.text);
  label.position.set(0, 22, 0);
  lib.add(label);
  scene.add(lib);

  for (let i = 0; i < 7; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const tz = LG_WORLD.spawnZ - 8 - (i * 13);
    const tree = lgTree(pal, i);
    tree.position.set(side * (7 + (i % 3) * 3), 0, tz);
    tree.rotation.y = i * 1.3;
    scene.add(tree);
  }

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('libgameCanvas'), antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const camera = new THREE.PerspectiveCamera(72, 1, 0.1, 500);
  camera.position.set(0, LG_EYE_HEIGHT, LG_WORLD.spawnZ);

  LG.renderer = renderer; LG.camera = camera; LG.outdoorScene = scene; LG.activeScene = scene;
  LG.built = true;
  lgResize();
}

// Real library floorplans use rows of double-sided stacks with aisles between them, not two
// walls — that's also the only way to fit thousands of books at a sane, walkable spacing instead
// of cramming them along just two long shelves. Every book in the catalog gets a slot; genres
// are sorted contiguous so each stack face reads as one section. Rendered as a single
// InstancedMesh (one draw call for every book) since individual meshes per book would be far
// too many draw calls for a phone GPU — each instance gets a hash-tinted color instead of a
// unique cover texture; tapping still opens the real detail sheet with the real cover.
const LG_RANGE_COUNT = 8, LG_TIERS = 5, LG_RANGE_SPACING = 6;
const LG_ROOM_HALF_X = 26, LG_ROOM_Z_NEAR = 34, LG_ROOM_Z_FAR = -46;

function lgBuildInterior(pal) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(pal.ceiling);
  scene.fog = new THREE.Fog(pal.wallInterior, 30, 85);

  scene.add(new THREE.AmbientLight(pal.ceiling, 1.8));
  scene.add(new THREE.HemisphereLight(pal.ceiling, pal.woodFloor2, 1.4));
  const lampMat = new THREE.MeshStandardMaterial({ color: pal.lamp, emissive: pal.lamp, emissiveIntensity: 1.4 });
  for (const z of [26, 10, -6, -22, -38]) {
    for (const x of [-14, 0, 14]) {
      const lamp = new THREE.PointLight(pal.lamp, 55, 26, 1.4);
      lamp.position.set(x, 4.2, z);
      scene.add(lamp);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), lampMat);
      bulb.position.copy(lamp.position);
      scene.add(bulb);
    }
  }

  const roomW = LG_ROOM_HALF_X * 2, roomD = LG_ROOM_Z_NEAR - LG_ROOM_Z_FAR, roomMidZ = (LG_ROOM_Z_NEAR + LG_ROOM_Z_FAR) / 2;
  const floorTex = lgGrainTexture(pal.woodFloor1, pal.woodFloor2, 256, 60, 10);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomD), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.8 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, roomMidZ);
  scene.add(floor);
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomD), new THREE.MeshStandardMaterial({ color: pal.ceiling, roughness: 1 }));
  ceiling.rotation.x = Math.PI / 2; ceiling.position.set(0, 4.6, roomMidZ);
  scene.add(ceiling);
  const wallMat = new THREE.MeshStandardMaterial({ color: pal.wallInterior, roughness: 0.9 });
  const farWall = new THREE.Mesh(new THREE.PlaneGeometry(roomW, 4.6), wallMat);
  farWall.position.set(0, 2.3, LG_ROOM_Z_FAR);
  scene.add(farWall);
  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomD, 4.6), wallMat);
  leftWall.position.set(-LG_ROOM_HALF_X, 2.3, roomMidZ); leftWall.rotation.y = Math.PI / 2;
  scene.add(leftWall);
  const rightWall = leftWall.clone();
  rightWall.position.x = LG_ROOM_HALF_X; rightWall.rotation.y = -Math.PI / 2;
  scene.add(rightWall);

  const allBooks = (window.DB.books || []).slice().sort((a, b) => (a.g || '').localeCompare(b.g || ''));
  const rowZStart = LG_ROOM_Z_NEAR - 4, rowZEnd = LG_ROOM_Z_FAR + 4, rowSpan = rowZStart - rowZEnd;
  const totalRows = LG_RANGE_COUNT * 2 * LG_TIERS;
  const perRow = Math.max(1, Math.ceil(allBooks.length / totalRows));
  const boardMat = new THREE.MeshStandardMaterial({ color: pal.shelfWood, roughness: 0.85 });

  const bookGeo = new THREE.BoxGeometry(0.42, 1.15, 0.13);
  const bookMat = new THREE.MeshStandardMaterial({ roughness: 0.6 });
  const instMesh = new THREE.InstancedMesh(bookGeo, bookMat, allBooks.length);
  instMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  const idsByInstance = new Array(allBooks.length);

  LG.shelfZones = [];
  let bi = 0;
  outer:
  for (let r = 0; r < LG_RANGE_COUNT; r++) {
    const rangeX = (r - (LG_RANGE_COUNT - 1) / 2) * LG_RANGE_SPACING;
    for (const faceSide of [-1, 1]) {
      const faceX = rangeX + faceSide * 0.32;
      for (let t = 0; t < LG_TIERS; t++) {
        const y = 0.9 + t * 0.85;
        const board = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, rowSpan), boardMat);
        board.position.set(rangeX, y, roomMidZ);
        scene.add(board);
        const thisRowCount = Math.min(perRow, allBooks.length - bi);
        if (thisRowCount > 0) {
          const gap = rowSpan / (thisRowCount + 1);
          let rowGenre = null;
          for (let k = 0; k < thisRowCount; k++) {
            const b = allBooks[bi];
            if (!rowGenre) rowGenre = b.g || 'Boshqa';
            const z = rowZStart - gap * (k + 1);
            dummy.position.set(faceX, y + 0.62, z);
            dummy.rotation.set(0, 0, 0);
            dummy.updateMatrix();
            instMesh.setMatrixAt(bi, dummy.matrix);
            col.setHex(lgHashColor(b.i));
            instMesh.setColorAt(bi, col);
            idsByInstance[bi] = b.i;
            bi++;
          }
          const label = lgLabelSprite(rowGenre, pal.text, 512, 128, 54);
          label.position.set(faceX, y + 1.0, rowZStart + 1.5);
          scene.add(label);
          LG.shelfZones.push({ name: rowGenre, x: faceX, zMid: roomMidZ });
        }
        if (bi >= allBooks.length) break outer;
      }
    }
  }
  instMesh.instanceMatrix.needsUpdate = true;
  if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;
  scene.add(instMesh);

  LG.bookMeshes = [instMesh];
  LG.bookInstanceIds = idsByInstance;
  LG.interiorScene = scene;
  LG.interiorBuilt = true;
}

function lgResize() {
  if (!LG.renderer) return;
  const canvas = LG.renderer.domElement;
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  LG.renderer.setSize(w, h, false);
  LG.camera.aspect = w / Math.max(1, h);
  LG.camera.updateProjectionMatrix();
}
window.addEventListener('resize', lgResize);

function lgStep(dt) {
  const cfg = LG_MODE_CFG[LG.mode] || LG_MODE_CFG.foot;
  if (LG.keys.left) LG.yaw += cfg.turnRate * dt;
  if (LG.keys.right) LG.yaw -= cfg.turnRate * dt;
  let target = 0;
  if (LG.keys.fwd) target = cfg.maxSpeed;
  else if (LG.keys.back) target = -cfg.maxSpeed * 0.5; // reversing is slower, like backing up
  if (LG.speed < target) LG.speed = Math.min(target, LG.speed + cfg.accel * dt);
  else if (LG.speed > target) LG.speed = Math.max(target, LG.speed - cfg.decel * dt);
  if (Math.abs(LG.speed) > 0.05) {
    LG.x += -Math.sin(LG.yaw) * LG.speed * dt;
    LG.z += -Math.cos(LG.yaw) * LG.speed * dt;
    LG.walk += Math.abs(LG.speed) * dt * 3.4;
  }
  const w = LG.inside ? LG_IN_WORLD : LG_WORLD;
  LG.x = Math.max(-w.halfX, Math.min(w.halfX, LG.x));
  LG.z = Math.max(w.zMin, Math.min(w.zMax, LG.z));

  const bob = Math.abs(LG.speed) > 0.3 ? Math.sin(LG.walk) * cfg.bobAmp : 0;
  LG.camera.position.set(LG.x, LG_EYE_HEIGHT + bob, LG.z);
  LG.camera.rotation.set(0, LG.yaw, 0);

  if (!LG.inside && !LG.atDoor) {
    const dist = Math.hypot(LG.x - LG_DOOR.x, LG.z - LG_DOOR.z);
    const near = dist < LG_KNOCK_DIST;
    if (near !== LG.nearDoor) {
      LG.nearDoor = near;
      document.getElementById('libKnock').classList.toggle('show', near);
    }
  }
  if (LG.inside && LG.shelfZones.length) {
    let closest = null, bestD = Infinity;
    for (const z of LG.shelfZones) {
      const d = Math.abs(LG.x - z.x) + Math.abs(LG.z - z.zMid) * 0.3;
      if (d < bestD) { bestD = d; closest = z; }
    }
    const lbl = document.getElementById('libGenreLabel');
    if (closest && bestD < 14) { lbl.textContent = closest.name; lbl.classList.add('show'); }
    else lbl.classList.remove('show');
  }
}

function lgTick(ts) {
  if (!LG.lastTs) LG.lastTs = ts;
  const dt = Math.min(0.05, (ts - LG.lastTs) / 1000);
  LG.lastTs = ts;
  lgStep(dt);
  LG.renderer.render(LG.activeScene, LG.camera);
  LG.raf = requestAnimationFrame(lgTick);
}

const lgRay = new THREE.Raycaster();
const lgPointer = new THREE.Vector2();
let lgTapStart = null;
function lgCanvasDown(e) { lgTapStart = { x: e.clientX, y: e.clientY, t: performance.now() }; }
function lgCanvasUp(e) {
  if (!lgTapStart) return;
  const dx = e.clientX - lgTapStart.x, dy = e.clientY - lgTapStart.y, dt = performance.now() - lgTapStart.t;
  lgTapStart = null;
  if (Math.hypot(dx, dy) > 10 || dt > 500 || !LG.inside || !LG.bookMeshes.length) return;
  const canvas = document.getElementById('libgameCanvas');
  const rect = canvas.getBoundingClientRect();
  lgPointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  lgPointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  lgRay.setFromCamera(lgPointer, LG.camera);
  const hits = lgRay.intersectObjects(LG.bookMeshes, false);
  if (!hits.length) return;
  const hit = hits[0];
  const id = hit.instanceId !== undefined ? LG.bookInstanceIds[hit.instanceId] : hit.object.userData.bookId;
  if (id) lgOpenBook(id);
}
function lgOpenBook(id) {
  window.haptic?.('light');
  if (LG.raf) { cancelAnimationFrame(LG.raf); LG.raf = null; }
  window.openedFromLibGame = true;
  window.openDetail(id);
}

function lgWireControls() {
  function bind(sel, key) {
    const el = document.querySelector(sel);
    el.addEventListener('pointerdown', e => { e.preventDefault(); LG.keys[key] = true; });
    const release = () => { LG.keys[key] = false; };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('pointerleave', release);
  }
  bind('#libUp', 'fwd'); bind('#libDown', 'back'); bind('#libLeft', 'left'); bind('#libRight', 'right');
  document.getElementById('libKnock').addEventListener('click', lgKnock);
  document.getElementById('libFoot').addEventListener('click', () => startLibGame('foot'));
  document.getElementById('libCar').addEventListener('click', () => startLibGame('car'));
  document.getElementById('libInteriorBack').addEventListener('click', lgLeaveInterior);
  const canvas = document.getElementById('libgameCanvas');
  canvas.addEventListener('pointerdown', lgCanvasDown);
  canvas.addEventListener('pointerup', lgCanvasUp);
  LG.wired = true;
}

// Fades the door out in place (no hinge geometry — reads fine as "opening" for a stylized
// scene) then walks the camera into the real interior shelf scene.
function lgKnock() {
  if (LG.atDoor) return;
  LG.atDoor = true;
  window.haptic?.('medium');
  Object.keys(LG.keys).forEach(k => LG.keys[k] = false);
  document.getElementById('libKnock').classList.remove('show');
  const door = LG.door, mat = door.material;
  const start = performance.now(), dur = 480;
  function anim(ts) {
    const t = Math.min(1, (ts - start) / dur);
    mat.opacity = 1 - t;
    door.position.y = 3.25 + t * 0.4;
    door.rotation.z = t * 0.5;
    if (t < 1) { requestAnimationFrame(anim); return; }
    lgEnterInterior();
  }
  requestAnimationFrame(anim);
}
function lgEnterInterior() {
  const pal = lgPalette();
  if (!LG.interiorBuilt) lgBuildInterior(pal);
  LG.inside = true;
  LG.activeScene = LG.interiorScene;
  LG.outdoorMode = LG.mode;
  LG.mode = 'inside';
  LG.x = 0; LG.z = 30; LG.yaw = 0; LG.speed = 0;
  document.getElementById('libInteriorBack').classList.add('show');
}
function lgLeaveInterior() {
  LG.inside = false;
  LG.activeScene = LG.outdoorScene;
  LG.mode = LG.outdoorMode;
  const door = LG.door, mat = door.material;
  mat.opacity = 1; door.position.y = 3.25; door.rotation.z = 0;
  LG.atDoor = false; LG.nearDoor = false;
  LG.x = 0; LG.z = LG_DOOR.z + LG_KNOCK_DIST + 3; LG.yaw = 0;
  document.getElementById('libInteriorBack').classList.remove('show');
  document.getElementById('libGenreLabel').classList.remove('show');
}

function startLibGame(mode) {
  LG.mode = mode; LG.outdoorMode = mode;
  document.getElementById('libChoice').classList.remove('show');
  document.getElementById('libgame').classList.toggle('car', mode === 'car');
  if (!LG.built) lgBuildOutdoor(lgPalette());
  LG.x = 0; LG.z = LG_WORLD.spawnZ; LG.yaw = 0; LG.speed = 0; LG.atDoor = false; LG.nearDoor = false; LG.inside = false;
  LG.activeScene = LG.outdoorScene;
  lgResize();
  LG.lastTs = 0;
  if (!LG.raf) LG.raf = requestAnimationFrame(lgTick);
}

function openLibGame() {
  if (!LG.wired) lgWireControls();
  document.getElementById('libgame').classList.add('open');
  document.getElementById('libChoice').classList.add('show');
  window.Telegram?.WebApp?.BackButton?.show();
}
function closeLibGame() {
  document.getElementById('libgame').classList.remove('open');
  document.getElementById('libChoice').classList.remove('show');
  document.getElementById('libInteriorBack').classList.remove('show');
  document.getElementById('libGenreLabel').classList.remove('show');
  document.getElementById('libKnock').classList.remove('show');
  window.Telegram?.WebApp?.BackButton?.hide();
  if (LG.raf) { cancelAnimationFrame(LG.raf); LG.raf = null; }
  Object.keys(LG.keys).forEach(k => LG.keys[k] = false);
  LG.mode = null;
}
window.lgResumeAfterDetail = function () {
  if (LG.built && document.getElementById('libgame').classList.contains('open') && !LG.raf) {
    LG.lastTs = 0;
    LG.raf = requestAnimationFrame(lgTick);
  }
};
window.openLibGame = openLibGame;
window.closeLibGame = closeLibGame;
</script>
</body>
</html>
