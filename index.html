    scene.add(b);
  }
  const lampSpots = [];
  for (let d = -Math.floor((-LG_WORLD.zMin - 60) / lampSpacing) * lampSpacing; d <= LG_WORLD.zMax - 60; d += lampSpacing) for (const side of [-1, 1]) lampSpots.push([side * 12, d]);
  for (let d = -Math.floor((LG_WORLD.halfX - 60) / lampSpacing) * lampSpacing; d <= LG_WORLD.halfX - 60; d += lampSpacing) for (const side of [-1, 1]) lampSpots.push([d, LG_CITY_CROSS_Z + side * 12]);
  for (const lp of lampSpots) {
    const lamp = lgStreetLamp(pal);
    lamp.position.set(lp[0], 0, lp[1]);
    scene.add(lamp);
  }

  // Real parked cars sitting in the street — walk up to any of them for Drive/Sit prompts, same
  // pattern as the library door. Occupancy (who's driving, who's riding along) is authoritative on
  // the server (see car_update/car_move over /ws/game) so every client renders the same shared
  // cars rather than each player's own private guess at where they are.
  LG.cars = [];
  if (lgCarModel) {
    for (const spawn of LG_CAR_SPAWNS) {
      const car = lgCarModel.clone(true);
      const box = new THREE.Box3().setFromObject(car);
      const size = new THREE.Vector3(); box.getSize(size);
      car.scale.setScalar(4.2 / (size.z || 1)); // real sedan length, the car's most recognizable dimension
      const box2 = new THREE.Box3().setFromObject(car);
      car.position.y -= box2.min.y;
      car.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      car.position.x = spawn.x; car.position.z = spawn.z;
      car.rotation.y = LG_CAR_FACING_OFFSET;
      scene.add(car);
      LG.cars.push({
        mesh: car, x: spawn.x, z: spawn.z, yaw: 0, driving: false,
        driverId: null, driverName: null, passengers: [], passengerMeshes: new Map(),
      });
    }
  }

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('libgameCanvas'), antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const camera = new THREE.PerspectiveCamera(72, 1, 0.1, 500);
  camera.position.set(0, LG_EYE_HEIGHT, LG_WORLD.spawnZ);
  // YXZ (not the default XYZ) so a swipe applies yaw around world-up first and pitch around the
  // camera's own local axis after — the standard order for an FPS-style look, avoids roll drift.
  camera.rotation.order = 'YXZ';

  // First-person "in the driver's seat" view: the real car model, cloned and parented to the
  // camera (so it rides along with every turn), replacing the old flat CSS windshield vignette
  // with actual hood/bumper geometry sitting in front of the driver. A camera's own children only
  // render if the camera itself is part of the scene graph, hence adding it here.
  scene.add(camera);
  let hoodMesh = null;
  if (lgCarModel) {
    hoodMesh = lgCarModel.clone(true);
    const hbox = new THREE.Box3().setFromObject(hoodMesh);
    const hsize = new THREE.Vector3(); hbox.getSize(hsize);
    hoodMesh.scale.setScalar(4.2 / (hsize.z || 1));
    hoodMesh.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } });
    hoodMesh.rotation.y = LG_CAR_FACING_OFFSET;
    hoodMesh.position.set(0, LG_HOOD_OFFSET.y, LG_HOOD_OFFSET.z);
    hoodMesh.visible = false;
    camera.add(hoodMesh);
  }
  LG.hoodMesh = hoodMesh;

  LG.renderer = renderer; LG.camera = camera; LG.outdoorScene = scene; LG.activeScene = scene;
  LG.built = true;
  lgResize();
}

// Real library floorplans use rows of double-sided stacks with aisles between them, not two
// walls — that's also the only way to fit thousands of books at a sane, walkable spacing instead
// of cramming them along just two long shelves. Every book in the catalog gets a slot; genres
// are sorted contiguous so each stack face reads as one section. Rendered as a single
// InstancedMesh (one draw call for every book) since individual meshes per book would be far
// too many draw calls for a phone GPU — each instance gets a hash-tinted color instead of a
// unique cover texture; tapping still opens the real detail sheet with the real cover.
const LG_RANGE_COUNT = 8, LG_TIERS = 5, LG_RANGE_SPACING = 6;
const LG_ROOM_HALF_X = 26, LG_ROOM_Z_NEAR = 34, LG_ROOM_Z_FAR = -46;

function lgBuildInterior(pal) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(pal.ceiling);
  scene.fog = new THREE.Fog(pal.wallInterior, 30, 85);

  // Book instances sit close to the ceiling lamps on the upper tiers — high intensity with a
  // gentle decay (1.4) blew those out to near-white under ACES tone mapping. Standard decay (2)
  // and a much lower per-lamp intensity, spread over more lamps, avoids that hotspot.
  scene.add(new THREE.AmbientLight(pal.ceiling, 0.35));
  scene.add(new THREE.HemisphereLight(pal.ceiling, pal.woodFloor2, 0.8));
  const lampMat = new THREE.MeshStandardMaterial({ color: pal.lamp, emissive: pal.lamp, emissiveIntensity: 1.4 });
  for (const z of [26, 10, -6, -22, -38]) {
    for (const x of [-14, 0, 14]) {
      const lamp = new THREE.PointLight(pal.lamp, 9, 15, 2);
      lamp.position.set(x, 4.2, z);
      scene.add(lamp);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), lampMat);
      bulb.position.copy(lamp.position);
      scene.add(bulb);
    }
  }

  const roomW = LG_ROOM_HALF_X * 2, roomD = LG_ROOM_Z_NEAR - LG_ROOM_Z_FAR, roomMidZ = (LG_ROOM_Z_NEAR + LG_ROOM_Z_FAR) / 2;
  const floorTex = lgGrainTexture(pal.woodFloor1, pal.woodFloor2, 256, 60, 10);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomD), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.8 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, roomMidZ);
  scene.add(floor);
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomD), new THREE.MeshStandardMaterial({ color: pal.ceiling, roughness: 1 }));
  ceiling.rotation.x = Math.PI / 2; ceiling.position.set(0, 4.6, roomMidZ);
  scene.add(ceiling);
  const wallMat = new THREE.MeshStandardMaterial({ color: pal.wallInterior, roughness: 0.9 });
  const farWall = new THREE.Mesh(new THREE.PlaneGeometry(roomW, 4.6), wallMat);
  farWall.position.set(0, 2.3, LG_ROOM_Z_FAR);
  scene.add(farWall);
  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomD, 4.6), wallMat);
  leftWall.position.set(-LG_ROOM_HALF_X, 2.3, roomMidZ); leftWall.rotation.y = Math.PI / 2;
  scene.add(leftWall);
  const rightWall = leftWall.clone();
  rightWall.position.x = LG_ROOM_HALF_X; rightWall.rotation.y = -Math.PI / 2;
  scene.add(rightWall);

  const allBooks = (window.DB.books || []).slice().sort((a, b) => (a.g || '').localeCompare(b.g || ''));
  const rowZStart = LG_ROOM_Z_NEAR - 4, rowZEnd = LG_ROOM_Z_FAR + 4, rowSpan = rowZStart - rowZEnd;
  const totalRows = LG_RANGE_COUNT * 2 * LG_TIERS;
  const perRow = Math.max(1, Math.ceil(allBooks.length / totalRows));
  const boardMat = new THREE.MeshStandardMaterial({ color: pal.shelfWood, roughness: 0.85 });

  const bookGeo = new THREE.BoxGeometry(0.42, 1.15, 0.13);
  const bookMat = new THREE.MeshStandardMaterial({ roughness: 0.6 });
  const instMesh = new THREE.InstancedMesh(bookGeo, bookMat, allBooks.length);
  instMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  const idsByInstance = new Array(allBooks.length);

  LG.shelfZones = [];
  let bi = 0;
  outer:
  for (let r = 0; r < LG_RANGE_COUNT; r++) {
    const rangeX = (r - (LG_RANGE_COUNT - 1) / 2) * LG_RANGE_SPACING;
    for (const faceSide of [-1, 1]) {
      const faceX = rangeX + faceSide * 0.32;
      for (let t = 0; t < LG_TIERS; t++) {
        const y = 0.9 + t * 0.85;
        const board = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, rowSpan), boardMat);
        board.position.set(rangeX, y, roomMidZ);
        scene.add(board);
        const thisRowCount = Math.min(perRow, allBooks.length - bi);
        if (thisRowCount > 0) {
          const gap = rowSpan / (thisRowCount + 1);
          let rowGenre = null;
          for (let k = 0; k < thisRowCount; k++) {
            const b = allBooks[bi];
            if (!rowGenre) rowGenre = b.g || 'Boshqa';
            const z = rowZStart - gap * (k + 1);
            // Every book was the exact same size — a flat wall of uniform bars reads as a
            // striped pattern, not a shelf of books. Real shelves are uneven: vary each one's
            // height/thickness (hash-derived so it's stable across rebuilds) and give it a
            // slight lean, the same trick most stylized bookshelf scenes rely on.
            const sy = 0.72 + lgHash01(b.i + '#h') * 0.5;
            const sz = 0.55 + lgHash01(b.i + '#t') * 1.0;
            const lean = (lgHash01(b.i + '#l') - 0.5) * 0.22;
            dummy.position.set(faceX, y + 0.03 + 0.575 * sy, z);
            dummy.rotation.set(lean, 0, 0);
            dummy.scale.set(1, sy, sz);
            dummy.updateMatrix();
            instMesh.setMatrixAt(bi, dummy.matrix);
            col.setHex(lgHashColor(b.i));
            instMesh.setColorAt(bi, col);
            idsByInstance[bi] = b.i;
            bi++;
          }
          const label = lgLabelSprite(rowGenre, pal.text, 512, 128, 54);
          label.position.set(faceX, y + 1.0, rowZStart + 1.5);
          scene.add(label);
          LG.shelfZones.push({ name: rowGenre, x: faceX, zMid: roomMidZ });
        }
        if (bi >= allBooks.length) break outer;
      }
    }
  }
  instMesh.instanceMatrix.needsUpdate = true;
  if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;
  // InstancedMesh auto-computes its culling bounds from ONE un-instanced box at the object's own
  // origin — it has no idea the instances are actually spread across the whole 70m room, so the
  // default frustum culling wrongly discards the entire mesh from almost any camera angle. This
  // is a single draw call either way, so disabling culling here costs nothing.
  instMesh.frustumCulled = false;
  scene.add(instMesh);

  LG.bookMeshes = [instMesh];
  LG.bookInstanceIds = idsByInstance;
  LG.interiorScene = scene;
  LG.interiorBuilt = true;
}

function lgResize() {
  if (!LG.renderer) return;
  const canvas = LG.renderer.domElement;
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  LG.renderer.setSize(w, h, false);
  LG.camera.aspect = w / Math.max(1, h);
  LG.camera.updateProjectionMatrix();
}
window.addEventListener('resize', lgResize);

// Keeps every client's copy of the 3 shared world cars visually in sync each frame: the car I'm
// personally driving mirrors my own local physics (and stays hidden — I see it via the hood-cam
// instead); everyone else's cars smoothly lerp toward whatever car_move/car_update last reported.
function lgStepCars() {
  for (let i = 0; i < LG.cars.length; i++) {
    const car = LG.cars[i];
    if (i === LG.drivingCarIndex) {
      car.x = LG.x; car.z = LG.z; car.yaw = LG.yaw;
      car.mesh.visible = false;
    } else {
      car.mesh.visible = true;
      if (car.driving) {
        car.mesh.position.x += (car.x - car.mesh.position.x) * 0.18;
        car.mesh.position.z += (car.z - car.mesh.position.z) * 0.18;
        let dyaw = (car.yaw + LG_CAR_FACING_OFFSET) - car.mesh.rotation.y;
        dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
        car.mesh.rotation.y += dyaw * 0.18;
      } else {
        car.mesh.position.set(car.x, car.mesh.position.y, car.z);
        car.mesh.rotation.y = car.yaw + LG_CAR_FACING_OFFSET;
      }
    }
    // Passenger clones are independent top-level scene objects, NOT children of car.mesh — the
    // car group carries its own scale (~1.6x, to stretch the raw model to a real 4.2m sedan
    // length), and parenting would silently compound that into the passenger's own scale/offsets
    // too. Positioning them by hand each frame via lgCarSeatWorld sidesteps that entirely.
    if (car.passengerMeshes.size) {
      car.passengers.forEach((p, idx) => {
        const mesh = car.passengerMeshes.get(p.id);
        if (!mesh) return;
        if (mesh.parent !== LG.outdoorScene) LG.outdoorScene.add(mesh);
        const seat = LG_CAR_SEAT_OFFSETS[idx % LG_CAR_SEAT_OFFSETS.length];
        const pos = lgCarSeatWorld(car, idx);
        mesh.position.set(pos.x, seat.y, pos.z);
        mesh.rotation.y = car.yaw + LG_CAR_FACING_OFFSET;
      });
    }
  }
}
function lgStep(dt) {
  // Riding along: no throttle/steering of your own, position is fully slaved to whichever car
  // you're seated in (which itself might be parked-and-waiting, or actively being driven by
  // someone else) — free look via swipe still works since that's handled independently in
  // lgCanvasMove, not here.
  if (LG.mode === 'passenger' && LG.mySeat) {
    const car = LG.cars[LG.mySeat.carId];
    if (car) {
      const seatIdx = Math.max(0, car.passengers.findIndex(p => p.id === LG_MP.myId));
      const pos = lgCarSeatWorld(car, seatIdx);
      LG.x = pos.x; LG.z = pos.z;
    }
    LG.camera.position.set(LG.x, LG_EYE_HEIGHT, LG.z);
    LG.camera.rotation.set(LG.pitch, LG.yaw, 0);
    if (!LG.inside) lgStepCars();
    return;
  }
  const cfg = LG_MODE_CFG[LG.mode] || LG_MODE_CFG.foot;
  // Steering while backing up: turning "left" while reversing needs to swing the car the way a
  // real driver expects looking back over their shoulder, which is the opposite screen-rotation
  // from turning left while moving forward — without this it feels backwards in reverse.
  const steerFlip = LG.speed < -0.05 ? -1 : 1;
  if (LG.keys.left) LG.yaw += cfg.turnRate * dt * steerFlip;
  if (LG.keys.right) LG.yaw -= cfg.turnRate * dt * steerFlip;
  let target = 0;
  if (LG.keys.fwd) target = cfg.maxSpeed;
  else if (LG.keys.back) target = -(cfg.reverseMax ?? cfg.maxSpeed * 0.5); // reversing is slower, like backing up
  if (LG.speed < target) LG.speed = Math.min(target, LG.speed + cfg.accel * dt);
  else if (LG.speed > target) LG.speed = Math.max(target, LG.speed - cfg.decel * dt);
  if (Math.abs(LG.speed) > 0.05) {
    LG.x += -Math.sin(LG.yaw) * LG.speed * dt;
    LG.z += -Math.cos(LG.yaw) * LG.speed * dt;
    // Caps the bob cycle's rate in car mode at what it was before the 250 km/h top speed —
    // driving the raw speed straight into this (as foot mode still does) would spin the sine wave
    // fast enough at redline to read as violent shaking instead of a gentle vibration.
    const walkSpeed = LG.mode === 'car' ? Math.min(Math.abs(LG.speed), 15) : Math.abs(LG.speed);
    LG.walk += walkSpeed * dt * 3.4;
  }
  const w = LG.inside ? LG_IN_WORLD : LG_WORLD;
  LG.x = Math.max(-w.halfX, Math.min(w.halfX, LG.x));
  LG.z = Math.max(w.zMin, Math.min(w.zMax, LG.z));

  const bob = Math.abs(LG.speed) > 0.3 ? Math.sin(LG.walk) * cfg.bobAmp : 0;
  LG.camera.position.set(LG.x, LG_EYE_HEIGHT + bob, LG.z);
  LG.camera.rotation.set(LG.pitch, LG.yaw, 0);

  // No knocking your way into the library from behind the wheel — the door prompt is foot-only.
  if (!LG.inside && !LG.atDoor && LG.mode !== 'car') {
    const dist = Math.hypot(LG.x - LG_DOOR.x, LG.z - LG_DOOR.z);
    const near = dist < LG_KNOCK_DIST;
    if (near !== LG.nearDoor) {
      LG.nearDoor = near;
      document.getElementById('libKnock').classList.toggle('show', near);
    }
  } else if (LG.nearDoor) {
    LG.nearDoor = false;
    document.getElementById('libKnock').classList.remove('show');
  }
  if (!LG.inside && LG.mode !== 'car' && LG.mode !== 'passenger' && LG.cars.length) {
    let bestIdx = -1, bestD = LG_CAR_ENTER_DIST;
    for (let i = 0; i < LG.cars.length; i++) {
      if (LG.cars[i].driving) continue; // a moving car isn't something you can walk up and get into
      const d = Math.hypot(LG.x - LG.cars[i].x, LG.z - LG.cars[i].z);
      if (d < bestD) { bestD = d; bestIdx = i; }
    }
    LG.nearCarIndex = bestIdx;
    const nc = bestIdx >= 0 ? LG.cars[bestIdx] : null;
    document.getElementById('libCarEnter').classList.toggle('show', !!nc && nc.driverId === null);
    document.getElementById('libCarSit').classList.toggle('show', !!nc && nc.passengers.length < LG_CAR_MAX_PASSENGERS);
  } else if (LG.nearCarIndex >= 0) {
    LG.nearCarIndex = -1;
    document.getElementById('libCarEnter').classList.remove('show');
    document.getElementById('libCarSit').classList.remove('show');
  }
  if (!LG.inside) lgStepCars();
  if (!LG.inside && LG.sunLight) {
    LG.sunLight.position.set(LG.x + 45, 65, LG.z + 25);
    LG.sunLight.target.position.set(LG.x, 0, LG.z);
  }
  if (!LG.inside && LG.fountainBooks) {
    const t = performance.now() / 1000;
    for (const b of LG.fountainBooks) {
      const u = b.userData;
      b.position.y = u.baseY + Math.sin(t * 0.9 + u.phase) * 0.18;
      b.rotation.y += dt * u.spin;
    }
  }
  if (LG.mode === 'car') {
    const speedoEl = document.getElementById('libSpeedo');
    if (speedoEl) speedoEl.textContent = Math.round(Math.abs(LG.speed) * 3.6) + ' km/soat';
    lgEngineUpdate(LG.speed);
  }
  if (LG.inside && LG.shelfZones.length) {
    let closest = null, bestD = Infinity;
    for (const z of LG.shelfZones) {
      const d = Math.abs(LG.x - z.x) + Math.abs(LG.z - z.zMid) * 0.3;
      if (d < bestD) { bestD = d; closest = z; }
    }
    const lbl = document.getElementById('libGenreLabel');
    if (closest && bestD < 14) { lbl?.classList.add('show'); if (lbl) lbl.textContent = closest.name; }
    else lbl?.classList.remove('show');
  }
}

function lgTick(ts) {
  if (!LG.lastTs) LG.lastTs = ts;
  const dt = Math.min(0.05, (ts - LG.lastTs) / 1000);
  LG.lastTs = ts;
  // A single bad frame must never permanently freeze the game — before this, any uncaught
  // exception here (a missing DOM element, a null from a multiplayer message, anything) would
  // silently kill the requestAnimationFrame chain forever with zero visible error, which reads to
  // a player as "I can't move" for no apparent reason. Log it and keep the loop alive instead.
  try {
    lgStep(dt);
    lgStepOthers(dt);
    if (LG_MP.ws && LG_MP.ws.readyState === WebSocket.OPEN && ts - LG_MP.lastSend > LG_MOVE_SEND_MS) {
      LG_MP.lastSend = ts;
      LG_MP.ws.send(JSON.stringify({ t: 'move', x: LG.x, z: LG.z, yaw: LG.yaw, scene: LG.inside ? 'interior' : 'outdoor', driving: LG.mode === 'car' }));
      if (LG.drivingCarIndex >= 0) {
        LG_MP.ws.send(JSON.stringify({ t: 'car_move', carId: LG.drivingCarIndex, x: LG.x, z: LG.z, yaw: LG.yaw }));
      }
    }
    LG.renderer.render(LG.activeScene, LG.camera);
    lgDrawMiniMap();
  } catch (e) {
    console.error('lgTick frame error (recovered):', e);
  }
  LG.raf = requestAnimationFrame(lgTick);
}

const lgRay = new THREE.Raycaster();
const lgPointer = new THREE.Vector2();
let lgTapStart = null;
let lgLookLast = null;
// Swipe-to-look: drag anywhere on the canvas to turn/tilt the camera, same as any first-person
// mobile game — the D-pad still handles moving forward/back, this only handles where you're
// looking. A drag that moves far enough cancels the tap-to-open-book gesture below.
function lgCanvasDown(e) {
  lgTapStart = { x: e.clientX, y: e.clientY, t: performance.now() };
  lgLookLast = { x: e.clientX, y: e.clientY };
}
function lgCanvasMove(e) {
  if (!lgLookLast) return;
  const dx = e.clientX - lgLookLast.x, dy = e.clientY - lgLookLast.y;
  lgLookLast = { x: e.clientX, y: e.clientY };
  // Turning is button-only on foot and while driving — a horizontal swipe used to also spin the
  // character/car's actual heading, which felt like losing steering control by accident just from
  // dragging to look around. A passenger doesn't control the car's heading either way, so they
  // still get free horizontal look. Vertical swipe (look up/down) never affected movement and
  // stays on for everyone.
  if (LG.mode === 'passenger') LG.yaw -= dx * LG_LOOK_SENS;
  LG.pitch = Math.max(-LG_PITCH_MAX, Math.min(LG_PITCH_MAX, LG.pitch - dy * LG_LOOK_SENS));
}
function lgCanvasEnd() { lgLookLast = null; }
function lgCanvasUp(e) {
  lgCanvasEnd();
  if (!lgTapStart) return;
  const dx = e.clientX - lgTapStart.x, dy = e.clientY - lgTapStart.y, dt = performance.now() - lgTapStart.t;
  lgTapStart = null;
  if (Math.hypot(dx, dy) > 10 || dt > 500 || !LG.inside || !LG.bookMeshes.length) return;
  const canvas = document.getElementById('libgameCanvas');
  const rect = canvas.getBoundingClientRect();
  lgPointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  lgPointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  lgRay.setFromCamera(lgPointer, LG.camera);
  const hits = lgRay.intersectObjects(LG.bookMeshes, false);
  if (!hits.length) return;
  const hit = hits[0];
  const id = hit.instanceId !== undefined ? LG.bookInstanceIds[hit.instanceId] : hit.object.userData.bookId;
  if (id) lgOpenBook(id);
}
function lgOpenBook(id) {
  window.haptic?.('light');
  if (LG.raf) { cancelAnimationFrame(LG.raf); LG.raf = null; }
  window.openedFromLibGame = true;
  window.openDetail(id);
}

const LG_KEY_MAP = {
  ArrowUp: 'fwd', w: 'fwd', W: 'fwd',
  ArrowDown: 'back', s: 'back', S: 'back',
  ArrowLeft: 'left', a: 'left', A: 'left',
  ArrowRight: 'right', d: 'right', D: 'right',
};
function lgKeyDown(e) {
  // Don't hijack arrow/WASD keys while actually typing in the chat box, and only drive when the
  // game is the thing on screen — a laptop's keyboard is otherwise live for the whole page.
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (!document.getElementById('libgame').classList.contains('open')) return;
  const key = LG_KEY_MAP[e.key];
  if (!key) return;
  LG.keys[key] = true;
  e.preventDefault();
}
function lgKeyUp(e) {
  const key = LG_KEY_MAP[e.key];
  if (key) LG.keys[key] = false;
}
function lgWireControls() {
  function bind(sel, key) {
    const el = document.querySelector(sel);
    el.addEventListener('pointerdown', e => { e.preventDefault(); LG.keys[key] = true; });
    const release = () => { LG.keys[key] = false; };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('pointerleave', release);
  }
  bind('#libUp', 'fwd'); bind('#libDown', 'back'); bind('#libLeft', 'left'); bind('#libRight', 'right');
  window.addEventListener('keydown', lgKeyDown);
  window.addEventListener('keyup', lgKeyUp);
  // A held key with no matching keyup (alt-tab, window losing focus mid-press) would otherwise
  // leave the character walking forever — release everything the moment focus leaves the page.
  window.addEventListener('blur', () => { Object.keys(LG.keys).forEach(k => LG.keys[k] = false); });
  document.getElementById('libKnock').addEventListener('click', lgKnock);
  document.getElementById('libCarEnter').addEventListener('click', lgEnterCar);
  document.getElementById('libCarSit').addEventListener('click', lgSitInCar);
  document.getElementById('libCarExit').addEventListener('click', lgLeaveCarOrSeat);
  document.getElementById('libEmoteToggle').addEventListener('click', lgToggleEmotePicker);
  document.getElementById('libEmotePicker').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-emoji]');
    if (btn) lgSendEmote(btn.dataset.emoji);
  });
  document.getElementById('libFoot').addEventListener('click', () => startLibGame('foot'));
  document.getElementById('libCar').addEventListener('click', () => startLibGame('car'));
  document.getElementById('libInteriorBack').addEventListener('click', lgLeaveInterior);
  document.getElementById('libOnline').addEventListener('click', lgToggleOnlineList);
  document.getElementById('libOnlineList').addEventListener('click', (e) => {
    const row = e.target.closest('.lo[data-id]');
    if (!row) return;
    lgOpenDM(Number(row.dataset.id), row.textContent.replace(/^🧑\s*/, ''));
  });
  document.getElementById('libChatModeBack').addEventListener('click', lgOpenGlobalChat);
  document.getElementById('libChatToggle').addEventListener('click', lgToggleChat);
  document.getElementById('libChatSend').addEventListener('click', lgSendChat);
  document.getElementById('libChatInput').addEventListener('keydown', e => { if (e.key === 'Enter') lgSendChat(); });
  document.getElementById('libChatImgBtn').addEventListener('click', lgPickChatImage);
  document.getElementById('libChatImgFile').addEventListener('change', lgOnChatImagePicked);
  const micBtn = document.getElementById('libChatMicBtn');
  micBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); lgStartChatVoice(); });
  micBtn.addEventListener('pointerup', lgStopChatVoice);
  micBtn.addEventListener('pointercancel', lgStopChatVoice);
  micBtn.addEventListener('pointerleave', lgStopChatVoice);
  const canvas = document.getElementById('libgameCanvas');
  canvas.addEventListener('pointerdown', lgCanvasDown);
  canvas.addEventListener('pointermove', lgCanvasMove);
  canvas.addEventListener('pointerup', lgCanvasUp);
  canvas.addEventListener('pointercancel', lgCanvasEnd);
  canvas.addEventListener('pointerleave', lgCanvasEnd);
  LG.wired = true;
}

// Fades the door out in place (no hinge geometry — reads fine as "opening" for a stylized
// scene) then walks the camera into the real interior shelf scene.
function lgKnock() {
  if (LG.atDoor || LG.mode === 'car') return;
  LG.atDoor = true;
  window.haptic?.('medium');
  Object.keys(LG.keys).forEach(k => LG.keys[k] = false);
  document.getElementById('libKnock').classList.remove('show');
  document.getElementById('libCarEnter').classList.remove('show');
  document.getElementById('libCarSit').classList.remove('show');
  const door = LG.door, mat = door.material;
  const start = performance.now(), dur = 480;
  function anim(ts) {
    const t = Math.min(1, (ts - start) / dur);
    mat.opacity = 1 - t;
    door.position.y = 4.25 + t * 0.4;
    door.rotation.z = t * 0.5;
    if (t < 1) { requestAnimationFrame(anim); return; }
    lgEnterInterior();
  }
  requestAnimationFrame(anim);
}
function lgEnterInterior() {
  const pal = lgPalette();
  if (!LG.interiorBuilt) lgBuildInterior(pal);
  LG.inside = true;
  LG.activeScene = LG.interiorScene;
  LG.outdoorMode = LG.mode;
  LG.mode = 'inside';
  LG.x = 0; LG.z = 30; LG.yaw = 0; LG.pitch = 0; LG.speed = 0;
  document.getElementById('libInteriorBack').classList.add('show');
}
function lgLeaveInterior() {
  LG.inside = false;
  LG.activeScene = LG.outdoorScene;
  LG.mode = LG.outdoorMode;
  const door = LG.door, mat = door.material;
  mat.opacity = 1; door.position.y = 4.25; door.rotation.z = 0;
  LG.atDoor = false; LG.nearDoor = false;
  LG.x = 0; LG.z = LG_DOOR.z + LG_KNOCK_DIST + 3; LG.yaw = 0; LG.pitch = 0;
  document.getElementById('libInteriorBack').classList.remove('show');
  document.getElementById('libGenreLabel').classList.remove('show');
}

// Synthesized engine hum (Web Audio, no sound file) — two voices: a sawtooth "buzz" through a
// lowpass (the mechanical edge) plus a quieter triangle an octave below for body/warmth. A single
// bare sawtooth got harsh/thin right at the top of the (much higher, post-250km/h-top-speed)
// range — the filter/gain ceilings here are deliberately capped well short of "wide open" so the
// tone stays a rumble instead of turning into a buzzsaw at redline.
let lgEngineCtx = null, lgEngineOsc = null, lgEngineOsc2 = null, lgEngineGain = null, lgEngineGain2 = null, lgEngineFilter = null;
function lgEngineStart() {
  if (lgEngineCtx) return;
  try {
    lgEngineCtx = new (window.AudioContext || window.webkitAudioContext)();
    lgEngineOsc = lgEngineCtx.createOscillator();
    lgEngineOsc.type = 'sawtooth';
    lgEngineOsc.frequency.value = 50;
    lgEngineFilter = lgEngineCtx.createBiquadFilter();
    lgEngineFilter.type = 'lowpass';
    lgEngineFilter.frequency.value = 260;
    lgEngineFilter.Q.value = 0.7;
    lgEngineGain = lgEngineCtx.createGain();
    lgEngineGain.gain.value = 0;
    lgEngineOsc.connect(lgEngineFilter).connect(lgEngineGain).connect(lgEngineCtx.destination);
    lgEngineOsc.start();
    lgEngineOsc2 = lgEngineCtx.createOscillator();
    lgEngineOsc2.type = 'triangle';
    lgEngineOsc2.frequency.value = 25;
    lgEngineGain2 = lgEngineCtx.createGain();
    lgEngineGain2.gain.value = 0;
    lgEngineOsc2.connect(lgEngineGain2).connect(lgEngineCtx.destination);
    lgEngineOsc2.start();
  } catch (e) { lgEngineCtx = null; }
}
function lgEngineStop() {
  if (!lgEngineCtx) return;
  try { lgEngineOsc.stop(); lgEngineOsc2.stop(); lgEngineCtx.close(); } catch (e) {}
  lgEngineCtx = null; lgEngineOsc = null; lgEngineOsc2 = null; lgEngineGain = null; lgEngineGain2 = null; lgEngineFilter = null;
}
function lgEngineUpdate(speed) {
  if (!lgEngineCtx) return;
  const s = Math.min(1, Math.abs(speed) / LG_MODE_CFG.car.maxSpeed);
  const now = lgEngineCtx.currentTime;
  const freq = 50 + s * 95;
  lgEngineOsc.frequency.setTargetAtTime(freq, now, 0.1);
  lgEngineGain.gain.setTargetAtTime(0.02 + s * 0.055, now, 0.1);
  lgEngineFilter.frequency.setTargetAtTime(260 + s * 480, now, 0.1);
  lgEngineOsc2.frequency.setTargetAtTime(freq / 2, now, 0.1);
  lgEngineGain2.gain.setTargetAtTime(0.015 + s * 0.04, now, 0.1);
}
// Adds/removes small idle-pose avatar clones for whoever's riding along (excluding the local
// player, who has no mesh of their own — they ARE the camera). Just creates/destroys the meshes
// here; lgStepCars positions them into their seat every frame as independent scene objects (see
// its own comment for why they aren't parented to the car mesh). Seat index is just the
// passenger's position in the array, matching lgCarSeatWorld's own indexing so a rendered
// passenger and the local player's own seat (if it's them) never disagree about which seat is whose.
function lgSyncPassengerMeshes(car) {
  const wanted = new Set(car.passengers.filter(p => p.id !== LG_MP.myId).map(p => p.id));
  for (const [id, mesh] of car.passengerMeshes) {
    if (!wanted.has(id)) { mesh.parent?.remove(mesh); car.passengerMeshes.delete(id); }
  }
  car.passengers.forEach((p, idx) => {
    if (p.id === LG_MP.myId || car.passengerMeshes.has(p.id)) return;
    const av = lgAvatarMesh(p.name, p.id);
    av.mesh.scale.setScalar(0.85);
    car.passengerMeshes.set(p.id, av.mesh);
  });
}
function lgEnterCar() {
  if (LG.drivingCarIndex >= 0 || LG.nearCarIndex < 0) return;
  const idx = LG.nearCarIndex;
  const car = LG.cars[idx];
  if (!car || car.driverId !== null) return;
  window.haptic?.('medium');
  LG.drivingCarIndex = idx;
  LG.nearCarIndex = -1;
  LG.mode = 'car';
  car.driverId = LG_MP.myId; car.driverName = 'Siz'; car.driving = true;
  car.mesh.visible = false;
  if (LG.hoodMesh) LG.hoodMesh.visible = true;
  document.getElementById('libgame').classList.add('car');
  document.getElementById('libCarEnter').classList.remove('show');
  document.getElementById('libCarSit').classList.remove('show');
  document.getElementById('libKnock').classList.remove('show');
  document.getElementById('libCarExit').classList.add('show');
  lgEngineStart();
  if (LG_MP.ws && LG_MP.ws.readyState === WebSocket.OPEN) {
    LG_MP.ws.send(JSON.stringify({ t: 'car_drive', carId: idx }));
  }
}
function lgSitInCar() {
  if (LG.mode === 'car' || LG.mode === 'passenger' || LG.nearCarIndex < 0) return;
  const idx = LG.nearCarIndex;
  const car = LG.cars[idx];
  if (!car || car.passengers.length >= LG_CAR_MAX_PASSENGERS) return;
  window.haptic?.('medium');
  LG.mySeat = { carId: idx };
  LG.mode = 'passenger';
  LG.nearCarIndex = -1;
  car.passengers.push({ id: LG_MP.myId, name: 'Siz' });
  document.getElementById('libgame').classList.add('riding');
  document.getElementById('libCarEnter').classList.remove('show');
  document.getElementById('libCarSit').classList.remove('show');
  document.getElementById('libKnock').classList.remove('show');
  document.getElementById('libCarExit').classList.add('show');
  if (LG_MP.ws && LG_MP.ws.readyState === WebSocket.OPEN) {
    LG_MP.ws.send(JSON.stringify({ t: 'car_sit', carId: idx }));
  }
}
// Handles exiting BOTH roles — driving and riding — since they share the one "Tushish" button.
// A driver stepping out parks the car (and strands any passengers still aboard, matching the
// server's own car_leave rule); a passenger stepping out just removes themselves from the seat
// list and stays standing wherever the car currently is.
function lgLeaveCarOrSeat() {
  if (LG.drivingCarIndex >= 0) {
    window.haptic?.('light');
    const idx = LG.drivingCarIndex;
    const car = LG.cars[idx];
    if (car) {
      car.driverId = null; car.driverName = null; car.driving = false;
      car.x = LG.x; car.z = LG.z; car.yaw = LG.yaw; car.passengers = [];
      lgSyncPassengerMeshes(car);
      car.mesh.position.set(car.x, car.mesh.position.y, car.z);
      car.mesh.rotation.y = car.yaw + LG_CAR_FACING_OFFSET;
      car.mesh.visible = true;
    }
    LG.drivingCarIndex = -1;
    LG.mode = 'foot';
    if (LG.hoodMesh) LG.hoodMesh.visible = false;
    document.getElementById('libgame').classList.remove('car');
    document.getElementById('libCarExit').classList.remove('show');
    lgEngineStop();
    if (LG_MP.ws && LG_MP.ws.readyState === WebSocket.OPEN) {
      LG_MP.ws.send(JSON.stringify({ t: 'car_leave', carId: idx, x: LG.x, z: LG.z, yaw: LG.yaw }));
    }
    // Step out to the side of the car, not straight down into its own footprint — the car's own
    // position/yaw are already pinned above, so this can't drift out of sync with where it parked.
    if (car) { const exitPos = lgCarExitWorld(car); LG.x = exitPos.x; LG.z = exitPos.z; }
  } else if (LG.mySeat) {
    window.haptic?.('light');
    const carId = LG.mySeat.carId;
    const car = LG.cars[carId];
    if (LG_MP.ws && LG_MP.ws.readyState === WebSocket.OPEN) {
      LG_MP.ws.send(JSON.stringify({ t: 'car_leave', carId, x: car ? car.x : LG.x, z: car ? car.z : LG.z, yaw: car ? car.yaw : LG.yaw }));
    }
    if (car) {
      car.passengers = car.passengers.filter(p => p.id !== LG_MP.myId);
      const exitPos = lgCarExitWorld(car);
      LG.x = exitPos.x; LG.z = exitPos.z;
    }
    LG.mySeat = null;
    LG.mode = 'foot';
    document.getElementById('libgame').classList.remove('riding');
    document.getElementById('libCarExit').classList.remove('show');
  }
}

async function startLibGame(mode) {
  LG.mode = mode; LG.outdoorMode = mode;
  document.getElementById('libChoice').classList.remove('show');
  document.getElementById('libgame').classList.toggle('car', mode === 'car');
  document.getElementById('libCarExit').classList.toggle('show', mode === 'car');
  if (!LG.built) await lgBuildOutdoor(lgPalette());
  // Choosing "Mashinada" up front means you're already driving the first world car the "Drive"
  // prompt would otherwise put you in — keep both paths in sync rather than leaving a second,
  // untouched parked copy sitting ignored at its spawn point.
  if (mode === 'car' && LG.cars[0]) {
    LG.cars[0].driverId = LG_MP.myId; LG.cars[0].driverName = 'Siz'; LG.cars[0].driving = true;
    LG.cars[0].mesh.visible = false;
    LG.drivingCarIndex = 0;
    if (LG.hoodMesh) LG.hoodMesh.visible = true;
    lgEngineStart();
    if (LG_MP.ws && LG_MP.ws.readyState === WebSocket.OPEN) {
      LG_MP.ws.send(JSON.stringify({ t: 'car_drive', carId: 0 }));
    }
  }
  // Spawning "in" car 0 but leaving the player's actual position at the foot spawn (25 units
  // away) meant the car itself would snap to match on the very next frame — the player would see
  // themselves ride off from empty ground, and stepping out immediately after dropped them right
  // back at the foot spawn with the car now teleported on top of them. Spawn at the car instead.
  if (mode === 'car' && LG.cars[0]) {
    LG.x = LG.cars[0].x; LG.z = LG.cars[0].z; LG.yaw = LG.cars[0].yaw;
  } else {
    LG.x = 0; LG.z = LG_WORLD.spawnZ; LG.yaw = 0;
  }
  LG.pitch = 0; LG.speed = 0; LG.atDoor = false; LG.nearDoor = false; LG.inside = false;
  LG.activeScene = LG.outdoorScene;
  lgResize();
  LG.lastTs = 0;
  if (!LG.raf) LG.raf = requestAnimationFrame(lgTick);
}

function openLibGame() {
  if (!LG.wired) lgWireControls();
  const gameEl = document.getElementById('libgame');
  gameEl.classList.add('open');
  // Telegram Desktop (and the plain web client) draws its own title bar over the top of the
  // Mini App — unlike the mobile clients' true fullscreen — which otherwise sits right on top of
  // the online pill / chat toggle / chat panel. `env(safe-area-inset-top)` doesn't know about
  // that chrome (it's not a real device notch), so detect it via the WebApp platform string.
  const platform = window.Telegram?.WebApp?.platform || '';
  gameEl.classList.toggle('desktopTg', !['ios', 'android'].includes(platform));
  document.getElementById('libChoice').classList.add('show');
  window.Telegram?.WebApp?.BackButton?.show();
  lgLoadModels();
  lgConnectMultiplayer();
}
function closeLibGame() {
  document.getElementById('libgame').classList.remove('open');
  document.getElementById('libChoice').classList.remove('show');
  document.getElementById('libInteriorBack').classList.remove('show');
  document.getElementById('libGenreLabel').classList.remove('show');
  document.getElementById('libKnock').classList.remove('show');
  document.getElementById('libChat')?.classList.remove('show');
  document.getElementById('libOnlineList')?.classList.remove('show');
  LG_MP.chatOpen = false;
  window.Telegram?.WebApp?.BackButton?.hide();
  if (LG.raf) { cancelAnimationFrame(LG.raf); LG.raf = null; }
  Object.keys(LG.keys).forEach(k => LG.keys[k] = false);
  LG.mode = null;
  // Disconnecting (below) makes the server release any car I was driving/riding automatically —
  // this just clears the LOCAL UI/state so a reopen doesn't start out thinking it's still driving.
  LG.drivingCarIndex = -1;
  LG.mySeat = null;
  document.getElementById('libgame').classList.remove('car', 'riding');
  lgEngineStop();
  lgReleaseChatMic();
  lgDisconnectMultiplayer();
}
window.lgResumeAfterDetail = function () {
  if (LG.built && document.getElementById('libgame').classList.contains('open') && !LG.raf) {
    LG.lastTs = 0;
    LG.raf = requestAnimationFrame(lgTick);
  }
};
window.openLibGame = openLibGame;
window.closeLibGame = closeLibGame;
</script>
